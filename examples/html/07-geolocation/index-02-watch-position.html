<!DOCTYPE html>
<!--
  ============================================================
  示例 02：watchPosition 持续定位 + SVG 轨迹绘制（真实 + Mock 双路径）
  ------------------------------------------------------------
  【知识点】
    1. watchPosition(success, error, options)：位置变化时持续回调，
       返回 watchId；clearWatch(watchId) 取消——不取消会持续耗电
    2. 轨迹类应用的核心三件事：收集点 → 画轨迹 → 累计里程
    3. Haversine 公式：经纬度球面距离（本例用简化版，够演示用）
    4. Mock 轨迹回放：定时器沿预设路线生成"移动的点"，
       与真实 watchPosition 共用同一套 onPoint 回调
    5. https / localhost 限制再次强调：file:// 下请用 Mock 模式
    6. 内联 SVG 折线 + 端点标记 + 自动缩放视野

  【运行方式】
    双击本文件 → 用 Mock 模式即可完整体验（无需权限）。
    真实定位需通过 http://localhost:xxxx 访问（如 npx serve .）并允许授权。

  【效果说明】
    - 点"开始（Mock）"：一个点沿西湖周边的模拟路线每秒移动一次，
      SVG 坐标图上轨迹折线逐步生长，里程与点数实时累计；
    - 点"开始（真实）"：走 watchPosition 真实授权流程，每个真实回调也会画上轨迹；
    - 点"停止"：clearWatch / 清掉模拟定时器，回调不再触发；
    - 点"清空"：轨迹与里程归零。

  【注意事项】
    - 真实定位静止不动时 watchPosition 仍可能低频回调（精度波动触发），
      真实轨迹若是一条短线属正常现象。
    - 离开页面时应 clearWatch（本例在 beforeunload 演示），真实 App 还应在
      visibilitychange 隐藏时暂停，避免后台耗电。
  ============================================================
-->
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地理定位 示例 02 · 持续定位与轨迹</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #cbd5e1;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 26px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      color: #f1f5f9;
      font-size: 22px;
    }

    p.desc {
      max-width: 700px;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .layout {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 860px;
    }

    .panel {
      background: #111c33;
      border: 1px solid #24344d;
      border-radius: 14px;
      padding: 16px 18px;
    }

    .panel.left {
      flex: 1;
      min-width: 280px;
    }

    .panel.right {
      flex: 1.3;
      min-width: 340px;
      text-align: center;
    }

    .panel h2 {
      color: #7dd3fc;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .panel p.tip {
      font-size: 12.5px;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 10px;
      text-align: left;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.ghost {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    button.stop {
      background: #b91c1c;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    /* 统计卡片 */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .stat {
      background: #0b1322;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .stat .num {
      font-size: 20px;
      color: #38bdf8;
      font-weight: bold;
      font-family: Consolas, monospace;
    }

    .stat .lbl {
      font-size: 11.5px;
      color: #94a3b8;
    }

    .status {
      font-size: 13px;
      background: #0b1322;
      border-left: 3px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 10px;
      margin: 10px 0;
      line-height: 1.7;
      text-align: left;
    }

    .status.err {
      border-left-color: #ef4444;
      color: #fca5a5;
    }

    .status.ok {
      border-left-color: #22c55e;
      color: #86efac;
    }

    svg.map {
      background: #0b1322;
      border: 1px solid #334155;
      border-radius: 10px;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%) translateY(20px);
      background: #0ea5e9;
      color: #04283a;
      font-size: 13.5px;
      padding: 10px 18px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 99;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <h1>地理定位 示例 02 · 持续定位与轨迹</h1>
  <p class="desc">
    watchPosition 是跑步/骑行/骑手轨迹类应用的核心。本页用<b>内联 SVG 自绘坐标图</b>（无任何地图 SDK），
    Mock 模式沿模拟路线回放移动点，真实模式走 watchPosition——两条路径共用同一套轨迹渲染。
    <b>真实定位需 https/localhost</b>，file:// 双击请用 Mock。
  </p>

  <div class="layout">
    <!-- ============ 左：控制与统计 ============ -->
    <div class="panel left">
      <h2>控制台</h2>
      <p class="tip">点数与里程实时累计；停止后务必 clearWatch（防后台耗电）。</p>
      <div class="row">
        <button id="btn-mock">开始（Mock 轨迹）</button>
        <button id="btn-real">开始（真实定位）</button>
        <button id="btn-stop" class="stop" disabled>停止</button>
        <button id="btn-clear" class="ghost">清空</button>
      </div>
      <div class="status" id="status">状态：空闲。</div>
      <div class="stats">
        <div class="stat">
          <div class="num" id="n-points">0</div>
          <div class="lbl">轨迹点数</div>
        </div>
        <div class="stat">
          <div class="num" id="n-dist">0.0</div>
          <div class="lbl">累计里程（米）</div>
        </div>
        <div class="stat">
          <div class="num" id="n-acc">-</div>
          <div class="lbl">当前精度（米）</div>
        </div>
        <div class="stat">
          <div class="num" id="n-mode">-</div>
          <div class="lbl">当前模式</div>
        </div>
      </div>
    </div>

    <!-- ============ 右：SVG 轨迹图 ============ -->
    <div class="panel right">
      <h2>轨迹图（内联 SVG，自动缩放视野）</h2>
      <!-- 只留网格背景，轨迹折线与端点由 JS 动态生成 -->
      <svg class="map" id="map" width="420" height="420" viewBox="0 0 420 420">
        <g stroke="#1e3a5f" stroke-width="1">
          <line x1="0" y1="84" x2="420" y2="84" />
          <line x1="0" y1="168" x2="420" y2="168" />
          <line x1="0" y1="252" x2="420" y2="252" />
          <line x1="0" y1="336" x2="420" y2="336" />
          <line x1="84" y1="0" x2="84" y2="420" />
          <line x1="168" y1="0" x2="168" y2="420" />
          <line x1="252" y1="0" x2="252" y2="420" />
          <line x1="336" y1="0" x2="336" y2="420" />
        </g>
        <!-- 轨迹折线：点集由 JS 拼装 -->
        <polyline id="trail" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"
          stroke-linejoin="round" points="" />
        <!-- 起点标记（绿）与当前点标记（红） -->
        <g id="start-dot" style="display:none">
          <circle r="6" fill="#22c55e" stroke="#fff" stroke-width="2" />
        </g>
        <g id="cur-dot" style="display:none">
          <circle r="5" fill="rgba(239,68,68,.35)" />
          <circle r="12" fill="rgba(239,68,68,.18)" />
          <circle r="5" fill="#ef4444" stroke="#fff" stroke-width="2" />
        </g>
        <text x="10" y="412" font-size="10" fill="#64748b" id="map-scale">视野：待首点定位后自动缩放</text>
      </svg>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    /* ================================================================
     * 0. 通用工具
     * ================================================================ */
    var toastEl = document.getElementById('toast'), toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
    }
    var statusEl = document.getElementById('status');
    function setStatus(text, cls) {
      statusEl.textContent = '状态：' + text;
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }

    // 简化球面距离（equirectangular 近似）：演示够用，商用请用 Haversine 完整式
    // 1 度纬度 ≈ 111320 米；经度要乘 cos(lat) 修正纬线圈变短
    function distM(a, b) {
      var dx = (b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180);
      var dy = (b[1] - a[1]) * 110540;
      return Math.sqrt(dx * dx + dy * dy);
    }

    /* ================================================================
     * 1. 轨迹状态与渲染
     * ================================================================ */
    var points = [];                 // 轨迹点数组 [[lng, lat], ...]
    var totalDist = 0;               // 累计里程（米）
    var mode = '-';                  // 'Mock' | '真实'
    var running = false;
    var watchId = null;              // 真实 watchPosition 的句柄
    var mockTimer = null;            // Mock 模式的定时器

    // 把 [lng, lat] 点集投影到 SVG 视野：以包围盒自动缩放 + 居中（模拟地图 fitView）
    function project(points) {
      if (!points.length) return [];
      var minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
      points.forEach(function (p) {
        minLng = Math.min(minLng, p[0]); maxLng = Math.max(maxLng, p[0]);
        minLat = Math.min(minLat, p[1]); maxLat = Math.max(maxLat, p[1]);
      });
      var W = 420, H = 420, PAD = 40;
      var sw = (maxLng - minLng) || 0.0005;    // 单点时给个最小视野，避免除 0
      var sh = (maxLat - minLat) || 0.0005;
      var scale = Math.min((W - PAD * 2) / sw, (H - PAD * 2) / sh);
      return points.map(function (p) {
        return [
          PAD + (p[0] - minLng) * scale,
          H - PAD - (p[1] - minLat) * scale    // SVG y 向下，纬度向上 → 翻转
        ];
      });
    }

    function render() {
      var px = project(points);
      document.getElementById('trail').setAttribute('points', px.map(function (p) { return p.join(','); }).join(' '));
      var startG = document.getElementById('start-dot');
      var curG = document.getElementById('cur-dot');
      if (px.length) {
        startG.style.display = '';
        startG.setAttribute('transform', 'translate(' + px[0][0] + ',' + px[0][1] + ')');
        curG.style.display = '';
        var last = px[px.length - 1];
        curG.setAttribute('transform', 'translate(' + last[0] + ',' + last[1] + ')');
      }
      document.getElementById('n-points').textContent = points.length;
      document.getElementById('n-dist').textContent = totalDist.toFixed(1);
      document.getElementById('map-scale').textContent =
        '视野：自动缩放（包围盒 ' + (px.length ? '已计算' : '待首点') + '），红色=当前位置，绿色=起点';
    }

    // 统一的"收到一个定位点"回调：真实与 Mock 共用
    function onPoint(lng, lat, acc) {
      var p = [lng, lat];
      if (points.length) totalDist += distM(points[points.length - 1], p);
      points.push(p);
      document.getElementById('n-acc').textContent = Math.round(acc);
      document.getElementById('n-mode').textContent = mode;
      render();
    }

    /* ================================================================
     * 2. Mock 轨迹回放：沿预设路线每 800ms 前进一"步"
     * ================================================================ */
    var mockRoute = [                          // 西湖周边模拟路线 [lng, lat]
      [120.1400, 30.2420], [120.1460, 30.2465], [120.1520, 30.2500],
      [120.1580, 30.2520], [120.1630, 30.2490], [120.1660, 30.2440],
      [120.1620, 30.2390], [120.1550, 30.2370], [120.1480, 30.2385], [120.1400, 30.2420]
    ];
    var mockIdx = 0;

    function startMock() {
      stopAll();                               // 防止两种模式同时跑
      mode = 'Mock'; running = true; setButtons();
      mockIdx = 0;
      setStatus('Mock 轨迹回放中…（每 800ms 一步）', 'ok');
      mockTimer = setInterval(function () {
        var p = mockRoute[mockIdx];
        // 每步叠加一点随机抖动，模拟真实 GPS 噪声
        onPoint(p[0] + (Math.random() - .5) * 0.0004, p[1] + (Math.random() - .5) * 0.0004, 15 + Math.random() * 25);
        mockIdx = (mockIdx + 1) % mockRoute.length;   // 循环回放
      }, 800);
      toast('Mock 轨迹开始回放');
    }

    /* ================================================================
     * 3. 真实 watchPosition
     * ================================================================ */
    function startReal() {
      stopAll();
      if (!('geolocation' in navigator)) {
        setStatus('当前环境不支持 Geolocation（需 https/localhost），请用 Mock 模式', 'err');
        return;
      }
      mode = '真实'; running = true; setButtons();
      setStatus('真实定位监听中…（等待浏览器授权与首个回调）', 'ok');
      watchId = navigator.geolocation.watchPosition(
        function (pos) {
          // 每次回调都统一走 onPoint —— 与 Mock 共用全部渲染逻辑
          onPoint(pos.coords.longitude, pos.coords.latitude, pos.coords.accuracy);
        },
        function (err) {
          var names = { 1: '权限被拒', 2: '位置不可用', 3: '超时' };
          setStatus('真实定位失败：' + (names[err.code] || err.code) + '，请检查授权后重试', 'err');
          stopAll();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 1000 }  // 轨迹场景要高频新数据
      );
    }

    /* ================================================================
     * 4. 停止与清理（clearWatch 是必须养成的习惯）
     * ================================================================ */
    function stopAll() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);     // 停掉真实监听，不停止会持续耗电
        watchId = null;
      }
      if (mockTimer !== null) {
        clearInterval(mockTimer);                      // 停掉 Mock 定时器
        mockTimer = null;
      }
      running = false;
      setButtons();
    }

    function setButtons() {
      document.getElementById('btn-stop').disabled = !running;
      document.getElementById('btn-mock').disabled = running;
      document.getElementById('btn-real').disabled = running;
    }

    document.getElementById('btn-mock').onclick = startMock;
    document.getElementById('btn-real').onclick = startReal;
    document.getElementById('btn-stop').onclick = function () {
      stopAll();
      setStatus('已停止监听（真实模式已 clearWatch，Mock 定时器已清除）');
      toast('已停止');
    };
    document.getElementById('btn-clear').onclick = function () {
      stopAll();
      points = []; totalDist = 0;
      document.getElementById('n-acc').textContent = '-';
      document.getElementById('n-mode').textContent = '-';
      document.getElementById('start-dot').style.display = 'none';
      document.getElementById('cur-dot').style.display = 'none';
      render();
      setStatus('轨迹已清空');
    };

    // 页面卸载时兜底清理：防止 watch 泄漏到后台
    window.addEventListener('beforeunload', function () {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    });

    /* 初始画面：保持空图（轨迹由"开始"按钮触发后逐步生长） */
    (function preview() {
      document.getElementById('map-scale').textContent = '视野：自动缩放。点击"开始"后轨迹将在此生长';
    })();
  </script>
</body>

</html>
