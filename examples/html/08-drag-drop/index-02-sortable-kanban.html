<!DOCTYPE html>
<!--
  ============================================================
  示例 02：拖拽排序列表 + 跨容器看板（事件委托 + 中心点插入算法）
  ------------------------------------------------------------
  【知识点】
    1. 列表内排序：dragover 里用"元素几何中心 vs 指针 Y"计算插入位置
    2. 跨容器拖放：多个列共用同一套 dragover/drop 逻辑（事件委托），
       卡片可跨列流转也可列内排序——看板工具的核心交互
    3. "实时归位"技巧：dragover 阶段直接 insertBefore 移动真实元素，
       drop 时元素已就位，只需更新业务状态（比克隆幽灵简单流畅）
    4. .dragging 类的两个作用：视觉半透明 + 业务过滤（排序算法跳过自己）
    5. dropEffect 与 effectAllowed 的配合；dragend 统一清理状态

  【运行方式】
    双击本文件直接打开。

  【效果说明】
    - 上半部分：单列表排序——拖动任务项上下移动，其余项实时腾位，
      松手后日志打印最终顺序；
    - 下半部分：三列看板（待办/进行中/已完成）——卡片可跨列拖动，
      每列头部的计数实时变化，松手后日志记录卡片去向；
    - 拖动中卡片半透明，拖到底部空白处自动追加到末尾。

  【注意事项】
    - 高频 dragover 里的 insertBefore 只在"插入位置变化"时产生真实 DOM 变化，
      浏览器自身会做一致性处理，性能足够；若列表巨大建议再加位置缓存判断。
    - 本示例仅覆盖桌面端；移动端需 Pointer Events 替代（见文档 2.6 节）。
  ============================================================
-->
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拖放 API 示例 02 · 排序列表与跨容器看板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #cbd5e1;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 26px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 { color: #f1f5f9; font-size: 22px; }
    p.desc { max-width: 700px; font-size: 14px; line-height: 1.8; text-align: center; }

    .panel { width: 100%; max-width: 860px; background: #111c33; border: 1px solid #24344d; border-radius: 14px; padding: 16px 18px; }
    .panel h2 { color: #7dd3fc; font-size: 15px; margin-bottom: 10px; }

    /* ===== 单列排序 ===== */
    .sort-list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0b1322;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: grab;
      user-select: none;
      font-size: 14px;
    }
    .item .grip { color: #475569; letter-spacing: 2px; }  /* 拖拽把手暗示 */
    .item.dragging { opacity: .35; border-style: dashed; cursor: grabbing; }
    .item b { color: #38bdf8; font-size: 12px; font-family: Consolas, monospace; }

    /* ===== 看板 ===== */
    .board { display: flex; gap: 14px; align-items: flex-start; }
    .column {
      flex: 1;
      background: #0b1322;
      border: 2px dashed #24344d;
      border-radius: 12px;
      padding: 10px;
      transition: border-color .15s, background .15s;
      min-width: 180px;
    }
    .column.over { border-color: #38bdf8; background: rgba(56, 189, 248, .06); }
    .column h3 {
      font-size: 13.5px;
      color: #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 8px;
    }
    .column h3 .cnt {
      background: #1e293b;
      color: #7dd3fc;
      border-radius: 999px;
      font-size: 11.5px;
      padding: 1px 9px;
      font-family: Consolas, monospace;
    }
    .cards { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
    .kcard {
      background: #1a2740;
      border: 1px solid #2b3c58;
      border-left: 3px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      cursor: grab;
      user-select: none;
    }
    .kcard.p1 { border-left-color: #ef4444; }
    .kcard.p2 { border-left-color: #f59e0b; }
    .kcard.p3 { border-left-color: #22c55e; }
    .kcard.dragging { opacity: .35; border-style: dashed; }

    /* 日志 */
    .log {
      background: #0b1322; border: 1px solid #334155; border-radius: 8px;
      padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px;
      line-height: 1.8; white-space: pre-wrap; word-break: break-all;
      max-height: 170px; overflow: auto;
    }
    .log .ok { color: #4ade80; }
    .log .sys { color: #94a3b8; }
  </style>
</head>

<body>
  <h1>拖放 API 示例 02 · 排序列表与看板</h1>
  <p class="desc">
    上：单列<b>排序</b>（中心点插入算法）；下：三列<b>看板</b>（跨容器流转 + 列内排序）。
    两处都用"dragover 实时归位"技巧：松手时元素已在正确位置，drop 只需更新业务状态。
  </p>

  <!-- ============ 单列排序 ============ -->
  <div class="panel">
    <h2>① 拖拽排序（单列表）</h2>
    <div class="sort-list" id="sort-list">
      <div class="item" draggable="true" data-id="a"><span class="grip">⠿</span><b>A-01</b> 需求评审会议纪要整理</div>
      <div class="item" draggable="true" data-id="b"><span class="grip">⠿</span><b>B-02</b> 登录页视觉走查</div>
      <div class="item" draggable="true" data-id="c"><span class="grip">⠿</span><b>C-03</b> 接口字段对齐文档</div>
      <div class="item" draggable="true" data-id="d"><span class="grip">⠿</span><b>D-04</b> 性能预算基线确认</div>
    </div>
  </div>

  <!-- ============ 三列看板 ============ -->
  <div class="panel">
    <h2>② 跨容器看板（可跨列拖动 + 列内排序）</h2>
    <div class="board">
      <div class="column" data-col="todo">
        <h3>待办 <span class="cnt">0</span></h3>
        <div class="cards">
          <div class="kcard p2" draggable="true" data-id="t1">首屏骨架屏接入</div>
          <div class="kcard p1" draggable="true" data-id="t2">线上告警阈值调优</div>
        </div>
      </div>
      <div class="column" data-col="doing">
        <h3>进行中 <span class="cnt">0</span></h3>
        <div class="cards">
          <div class="kcard p3" draggable="true" data-id="t3">移动端手势库调研</div>
        </div>
      </div>
      <div class="column" data-col="done">
        <h3>已完成 <span class="cnt">0</span></h3>
        <div class="cards">
          <div class="kcard p2" draggable="true" data-id="t4">图片懒加载上线</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 日志 ============ -->
  <div class="panel">
    <h2>操作日志</h2>
    <div class="log" id="log"></div>
  </div>

  <script>
    /* ================================================================
     * 0. 日志工具
     * ================================================================ */
    var logEl = document.getElementById('log');
    function log(text, cls) {
      var div = document.createElement('div');
      div.className = cls || 'sys';
      div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
      logEl.insertBefore(div, logEl.firstChild);
    }

    /* ================================================================
     * 1. 核心算法：找"该插到谁前面"
     * 原理：遍历容器内所有（除拖拽中以外的）卡片，找"几何中心
     * 在指针之下、且离指针最近"的那个元素作为插入锚点。
     * ================================================================ */
    function getAfterEl(container, y, selector) {
      var items = container.querySelectorAll(selector + ':not(.dragging)');
      var best = null, bestOffset = -Infinity;
      items.forEach(function (child) {
        var box = child.getBoundingClientRect();
        var offset = y - (box.top + box.height / 2); // 鼠标在中心之下 → 正数
        if (offset < 0 && offset > bestOffset) {     // 只关心"在中心之上"的最近项
          bestOffset = offset;
          best = child;
        }
      });
      return best;                                    // null 表示应追加到末尾
    }

    /* ================================================================
     * 2. 单列排序
     * ================================================================ */
    var sortList = document.getElementById('sort-list');
    var sortDragging = null;

    sortList.addEventListener('dragstart', function (e) {
      var item = e.target.closest('.item');
      if (!item) return;
      sortDragging = item;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.dataset.id); // 必须写点数据，否则部分浏览器不启动拖拽
      log('开始排序：' + item.dataset.id);
    });

    sortList.addEventListener('dragover', function (e) {
      e.preventDefault();                             // 放行投放
      e.dataTransfer.dropEffect = 'move';
      if (!sortDragging) return;
      var after = getAfterEl(sortList, e.clientY, '.item');
      if (after == null) sortList.appendChild(sortDragging);      // 拖到列表最底：追加
      else if (after !== sortDragging) sortList.insertBefore(sortDragging, after); // 实时归位
    });

    sortList.addEventListener('drop', function (e) { e.preventDefault(); });
    sortList.addEventListener('dragend', function () {
      if (!sortDragging) return;
      sortDragging.classList.remove('dragging');
      // 打印最终顺序：按 DOM 顺序读 data-id
      var order = [];
      sortList.querySelectorAll('.item').forEach(function (it) { order.push(it.dataset.id); });
      log('排序完成，最终顺序：' + order.join(' → '), 'ok');
      sortDragging = null;
    });

    /* ================================================================
     * 3. 三列看板：事件委托，三列共用同一套逻辑
     * ================================================================ */
    var boardDragging = null;

    // 源端事件同样委托到 board 容器（卡片很多时不用逐个绑）
    var board = document.querySelector('.board');

    board.addEventListener('dragstart', function (e) {
      var card = e.target.closest('.kcard');
      if (!card) return;
      boardDragging = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.id);
      var col = card.closest('.column');
      log('卡片 ' + card.dataset.id + ' 开始拖动（当前列：' + col.dataset.col + '）');
    });

    board.addEventListener('dragover', function (e) {
      // 找指针下的列：closest 向上找，这样 drop 在卡片间隙/空白处也能命中列
      var col = e.target.closest('.column');
      if (!col) return;
      e.preventDefault();                             // 每列都要放行
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');                      // 高亮当前列
      if (!boardDragging) return;
      var cards = col.querySelector('.cards');
      var after = getAfterEl(cards, e.clientY, '.kcard');
      if (after == null) cards.appendChild(boardDragging);
      else if (after !== boardDragging) cards.insertBefore(boardDragging, after);
    });

    // 高亮清理：dragover 维护"进"，dragleave/delegate 维护"出"
    board.addEventListener('dragleave', function (e) {
      var col = e.target.closest('.column');
      if (col) col.classList.remove('over');
    });

    board.addEventListener('drop', function (e) {
      e.preventDefault();                             // 阻止默认（如文本拖入导航）
      var col = e.target.closest('.column');
      if (col) col.classList.remove('over');
      // 注意：因为 dragover 已经"实时归位"，这里不需要再移动 DOM，
      // 只做业务层的事：更新计数 + 记日志
    });

    board.addEventListener('dragend', function () {
      if (!boardDragging) return;
      var card = boardDragging;
      card.classList.remove('dragging');
      boardDragging = null;
      // 更新所有列的计数（drop 时元素已就位，直接读 DOM 即为最新状态）
      document.querySelectorAll('.column').forEach(function (col) {
        col.querySelector('.cnt').textContent = col.querySelectorAll('.kcard').length;
      });
      var colName = card.closest('.column').dataset.col;
      log('卡片 ' + card.dataset.id + ' 已归位到「' + colName + '」，各列计数已刷新', 'ok');
    });

    /* 初始化：把每列当前计数填上 */
    (function init() {
      document.querySelectorAll('.column').forEach(function (col) {
        col.querySelector('.cnt').textContent = col.querySelectorAll('.kcard').length;
      });
      log('提示：上表排序，下板跨列拖动；拖到列的空白区域会追加到末尾', 'sys');
    })();
  </script>
</body>

</html>
