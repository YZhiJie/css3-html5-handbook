  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · CSS 篇</text>
  <text class="t bt" x="40" y="80">第 45 话 · @layer 进阶 — 嵌套层、匿名层与 revert-layer</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.45</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 基础 @layer 不够用</text>
  <rect x="64" y="176" width="248" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="78" y="198" font-size="12" font-weight="bold" fill="#f87171">三个新痛点</text>
  <text class="m" x="78" y="220" font-size="10" fill="#cbd5e1">base 层内再分 reset/tokens</text>
  <text class="m" x="78" y="238" font-size="10" fill="#cbd5e1">第三方库 CSS 无 @layer</text>
  <text class="m" x="78" y="256" font-size="10" fill="#cbd5e1">只想撤销某一层覆盖</text>
  <text class="t" x="78" y="278" font-size="10" fill="#f87171">大型项目层内混乱</text>
  <text class="t" x="78" y="296" font-size="10" fill="#94a3b8">第三方样式插队</text>
  <text class="t" x="78" y="314" font-size="10" fill="#94a3b8">覆盖回不去</text>
  <rect x="326" y="176" width="246" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="340" y="198" font-size="12" font-weight="bold" fill="#94a3b8">叠加痛苦</text>
  <text class="t" x="340" y="220" font-size="10" fill="#f87171">· 层内再分层需求</text>
  <text class="t" x="340" y="238" font-size="10" fill="#f87171">· 老库污染层叠顺序</text>
  <text class="t" x="340" y="256" font-size="10" fill="#f87171">· 覆盖后无法回退</text>
  <text class="t" x="340" y="278" font-size="10" fill="#94a3b8">特异性战争复发</text>
  <text class="t" x="340" y="296" font-size="10" fill="#94a3b8">!important 满天飞</text>
  <text class="t" x="64" y="362" font-size="13" font-weight="bold" fill="#f87171">「基础 @layer 管得住顺序，管不住大型项目复杂度！」</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">?</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 进阶三件套</text>
  <rect x="648" y="176" width="250" height="170" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="662" y="198" font-size="12" font-weight="bold" fill="#22d3ee">嵌套层</text>
  <text class="m" x="662" y="218" font-size="10" fill="#cbd5e1">@layer base {</text>
  <text class="m" x="662" y="234" font-size="10" fill="#cbd5e1">  @layer reset { }</text>
  <text class="m" x="662" y="250" font-size="10" fill="#cbd5e1">  @layer tokens { }</text>
  <text class="m" x="662" y="266" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="662" y="290" font-size="10" fill="#94a3b8">层内再分层</text>
  <text class="t" x="662" y="308" font-size="10" fill="#94a3b8">顺序 = 父层+子层</text>
  <rect x="914" y="176" width="230" height="170" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="928" y="198" font-size="12" font-weight="bold" fill="#a78bfa">匿名层</text>
  <text class="m" x="928" y="218" font-size="10" fill="#cbd5e1">@layer {</text>
  <text class="m" x="928" y="234" font-size="10" fill="#cbd5e1">  /* 第三方 CSS */</text>
  <text class="m" x="928" y="250" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="928" y="274" font-size="10" fill="#94a3b8">无名包裹第三方</text>
  <text class="t" x="928" y="292" font-size="10" fill="#fbbf24">⚠ 不可追加内容</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">「revert-layer：回退到上一层，不是浏览器默认」</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 四大实战场景</text>
  <!-- 嵌套层 -->
  <rect x="64" y="440" width="250" height="160" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#22d3ee">嵌套层分组</text>
  <text class="m" x="78" y="484" font-size="10" fill="#cbd5e1">@layer base {</text>
  <text class="m" x="78" y="500" font-size="10" fill="#cbd5e1">  @layer reset { }</text>
  <text class="m" x="78" y="516" font-size="10" fill="#cbd5e1">  @layer tokens { }</text>
  <text class="t" x="78" y="540" font-size="10" fill="#94a3b8">大型设计系统分层</text>
  <text class="t" x="78" y="558" font-size="10" fill="#94a3b8">reset/tokens/typography</text>
  <!-- 匿名层 -->
  <rect x="330" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="344" y="462" font-size="12" font-weight="bold" fill="#a78bfa">匿名层包裹第三方</text>
  <text class="m" x="344" y="484" font-size="10" fill="#cbd5e1">@layer {</text>
  <text class="m" x="344" y="500" font-size="10" fill="#cbd5e1">  /* antd 产物 */</text>
  <text class="m" x="344" y="516" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="344" y="540" font-size="10" fill="#94a3b8">第三方库隔离</text>
  <text class="t" x="344" y="558" font-size="10" fill="#94a3b8">不污染命名层</text>
  <!-- revert-layer -->
  <rect x="586" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text class="t" x="600" y="462" font-size="12" font-weight="bold" fill="#fbbf24">revert-layer</text>
  <text class="m" x="600" y="484" font-size="10" fill="#cbd5e1">color: revert-layer</text>
  <text class="t" x="600" y="508" font-size="10" fill="#94a3b8">回退到上一层</text>
  <text class="t" x="600" y="526" font-size="10" fill="#94a3b8">不是浏览器默认</text>
  <text class="t" x="600" y="544" font-size="10" fill="#fbbf24">⚠ Chrome 112+</text>
  <!-- 第三方覆盖 -->
  <rect x="842" y="440" width="302" height="160" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="856" y="462" font-size="12" font-weight="bold" fill="#f472b6">覆盖第三方库</text>
  <text class="m" x="856" y="484" font-size="10" fill="#cbd5e1">@layer antd, components;</text>
  <text class="t" x="856" y="508" font-size="10" fill="#94a3b8">antd 固定在底层</text>
  <text class="t" x="856" y="526" font-size="10" fill="#94a3b8">components 永远覆盖</text>
  <text class="t" x="856" y="544" font-size="10" fill="#fbbf24">无需 !important</text>
  <text class="t" x="856" y="562" font-size="10" fill="#94a3b8">Chrome 99+ / Safari 15.4+</text>
  <path d="M 552 428 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fbbf24"/>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">嵌套层顺序 = 父层顺序 + 子层声明顺序；最多两层，三层可读性急剧下降</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">匿名层只用于包裹第三方 CSS；业务代码必须进命名层，否则无法追加</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">revert-layer 回退到上一层，revert 回退到浏览器默认——别搞混</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.45 · 层叠</text>

  <text class="t ft" x="40" y="822">霓虹墨 Neon Ink · 第 45 话 — 深入阅读 docs/css/28-layer-advanced.md · 示例 examples/css/28-layer-advanced</text>
