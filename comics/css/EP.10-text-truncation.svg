  <text class="t pt" x="92" y="152">痛点现场 · 长文件名顶飞了按钮</text>

  <rect x="64" y="172" width="460" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M 82 196 L 92 186 L 118 186 L 118 218 L 82 218 Z" fill="#fbbf24" stroke="#0b1220" stroke-width="1.5"/>
  <rect x="92" y="180" width="14" height="8" rx="2" fill="#fbbf24" stroke="#0b1220" stroke-width="1.5"/>
