  <text class="t pt" x="668" y="152">机制登场 · 省略号出现的三要素</text>

  <rect x="640" y="168" width="252" height="30" rx="8" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="m" x="656" y="188" font-size="11.5" fill="#67e8f9">white-space: nowrap;</text>
  <text class="t an" x="908" y="188">① 先禁止换行</text>
  <rect x="640" y="206" width="252" height="30" rx="8" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="m" x="656" y="226" font-size="11.5" fill="#67e8f9">overflow: hidden;</text>
  <text class="t an" x="908" y="226">② 超出才能被裁</text>
  <rect x="640" y="244" width="252" height="30" rx="8" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="m" x="656" y="264" font-size="11.5" fill="#67e8f9">text-overflow: ellipsis;</text>
  <text class="t an" x="908" y="264">③ 边界画上省略号</text>

  <rect x="640" y="288" width="424" height="58" rx="10" fill="#fbbf24" opacity="0.1" stroke="#fbbf24" stroke-width="2"/>
  <text class="m" x="656" y="313" font-size="12" fill="#fbbf24">.title { flex:1; min-width: 0; }</text>
  <text class="t" x="656" y="337" font-size="11.5" fill="#fde68a">解除 min-content 下限，三件套在收缩后宽度上才生效</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

