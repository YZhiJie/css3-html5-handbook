  <text class="t" x="64" y="256" font-size="14" font-weight="bold" fill="#f87171">flex:1 没给 min-width:0，按钮被长标题顶飞</text>
  <text class="m" x="64" y="284" font-size="11.5" fill="#fca5a5">.title { flex: 1; } /* min-width:auto = min-content */</text>
  <text class="t an" x="64" y="312">flex 子项的最小宽度等于最长单词（min-content），拒绝收缩</text>
  <text class="t an" x="64" y="336">它不是不支持省略号——盒子压根没被压窄</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <circle cx="556" cy="272" r="12" fill="#f87171"/>
  <text class="t" x="556" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">!</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
