  <text class="t" x="570" y="526" font-size="12" font-weight="bold" fill="#22d3ee" transform="rotate(90 570 526)">等高对齐</text>

  <rect x="590" y="442" width="548" height="100" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="606" y="466" font-size="11.5" fill="#22d3ee">display: -webkit-box;</text>
  <text class="m" x="606" y="486" font-size="11.5" fill="#22d3ee">-webkit-box-orient: vertical;</text>
  <text class="m" x="606" y="506" font-size="11.5" fill="#22d3ee">-webkit-line-clamp: 2;  line-clamp: 2;  /* 双写 */</text>
  <text class="m" x="606" y="526" font-size="11.5" fill="#22d3ee">overflow: hidden;</text>

  <rect x="590" y="554" width="268" height="52" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="m" x="604" y="576" font-size="11" fill="#fbbf24">overflow-wrap: anywhere</text>
  <text class="t an" x="604" y="595" font-size="11">断行点计入 min-content，救 flex</text>
  <rect x="872" y="554" width="266" height="52" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="m" x="886" y="576" font-size="11" fill="#cbd5e1">overflow-wrap: break-word</text>
  <text class="t an" x="886" y="595" font-size="11">视觉也断，但最小宽度不变</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
