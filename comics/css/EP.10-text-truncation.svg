  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">单行三件套：nowrap + overflow:hidden + ellipsis，少一个省略号都不出现</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">flex/grid 子项先写 min-width:0（或 minmax(0,1fr)），盒子被压窄才谈截断</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">多行 line-clamp 四件套与标准属性双写；URL 用 anywhere，break-all 只给代码</text>
