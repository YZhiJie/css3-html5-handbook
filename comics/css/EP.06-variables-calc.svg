  <text class="t kb" x="266" y="736">calc 运算符两侧必须有空格：calc(100% - 10px) 对，calc(100%-10px) 失效</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">未注册的变量是字符串不能插值；@property 注册类型后才能参与过渡与动画</text>
