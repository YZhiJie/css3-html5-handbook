  <text class="t" x="536" y="462" font-size="13" font-weight="bold" fill="#f8fafc">calc 的空格红线</text>
  <text class="m" x="536" y="488" font-size="11.5" fill="#22d3ee">calc(100% - 10px) ✓</text>
  <text class="m" x="536" y="510" font-size="11.5" fill="#f87171">calc(100%-10px) ✗ 解析失败</text>
  <text class="t" x="536" y="536" font-size="11" fill="#94a3b8">clamp(MIN, VAL, MAX) 顺序别写反</text>
  <rect x="820" y="438" width="300" height="120" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="836" y="462" font-size="13" font-weight="bold" fill="#f8fafc">@property：变量能动画了</text>
  <text class="m" x="836" y="488" font-size="11" fill="#cbd5e1">@property --deg { syntax:'&lt;angle&gt;' }</text>
  <text class="t" x="836" y="512" font-size="11" fill="#94a3b8">未注册 = 字符串，只能跳变</text>
  <text class="t" x="836" y="532" font-size="11" fill="#94a3b8">注册后逐帧插值，渐变能转了</text>
  <text class="m" x="64" y="584" font-size="11" fill="#fbbf24">document.documentElement.dataset.theme = 'dark'</text>
