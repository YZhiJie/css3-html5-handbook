  <rect x="640" y="172" width="160" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="652" y="194" font-size="10.5" fill="#22d3ee">aspect-ratio: 16/9</text>
