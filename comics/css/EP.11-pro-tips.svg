  <rect x="812" y="172" width="160" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="824" y="194" font-size="10.5" fill="#22d3ee">object-fit: cover</text>
  <text class="t" x="824" y="214" font-size="10.5" fill="#cbd5e1">填满裁切不变形</text>
  <rect x="984" y="172" width="160" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="996" y="194" font-size="10.5" fill="#22d3ee">position: sticky</text>
  <text class="t" x="996" y="214" font-size="10.5" fill="#cbd5e1">吸顶且不脱离文档流</text>
  <rect x="640" y="240" width="160" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="652" y="262" font-size="10.5" fill="#f472b6">scroll-snap-type</text>
  <text class="t" x="652" y="282" font-size="10.5" fill="#cbd5e1">滚动停止自动吸附</text>
  <rect x="812" y="240" width="160" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="824" y="262" font-size="10.5" fill="#f472b6">clip-path: polygon</text>
  <text class="t" x="824" y="282" font-size="10.5" fill="#cbd5e1">几何裁剪不吃事件</text>
  <rect x="984" y="240" width="160" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="996" y="262" font-size="10.5" fill="#f472b6">:focus-visible</text>
  <text class="t" x="996" y="282" font-size="10.5" fill="#cbd5e1">键盘导航才显焦点环</text>

