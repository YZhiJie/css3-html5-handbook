  <text class="t kb" x="266" y="708">aspect-ratio 是偏好不是强制：内容能撑高盒子，锁比例配 overflow:hidden</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">内容图用 img+object-fit，装饰图才用背景；sticky 失效先查祖先链 overflow</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">居中选型：流内 flex/grid，浮层 transform 回拉；别裸删 outline，用 :focus-visible</text>
