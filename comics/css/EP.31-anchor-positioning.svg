  <rect x="0" y="0" width="1200" height="840" fill="#0b1220"/>

  <!-- ===== 顶部横幅 ===== -->
  <rect x="40" y="6" width="120" height="6" rx="3" fill="#22d3ee"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#f472b6"/>
  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · CSS 篇</text>
  <text class="t bt" x="40" y="80">第 31 话 · 锚点定位 — 把元素钉在另一个元素旁边</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.31</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · JS 算坐标重灾区</text>
  <rect x="64" y="176" width="248" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="78" y="198" font-size="12" font-weight="bold" fill="#f87171">Tooltip 紧跟目标</text>
  <text class="m" x="78" y="220" font-size="10" fill="#cbd5e1">getBoundingClientRect()</text>
  <text class="m" x="78" y="238" font-size="10" fill="#cbd5e1">+ scroll/resize 监听</text>
  <text class="m" x="78" y="256" font-size="10" fill="#cbd5e1">+ rAF 节流重算</text>
  <text class="t" x="78" y="280" font-size="10" fill="#f87171">定位 JS 占组件库 1/3 体积</text>
  <text class="t" x="78" y="298" font-size="10" fill="#94a3b8">快速滚动时跳帧、抖动</text>
  <text class="t" x="78" y="316" font-size="10" fill="#94a3b8">SSR 输出结构不完整</text>
  <rect x="326" y="176" width="246" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="340" y="198" font-size="12" font-weight="bold" fill="#94a3b8">叠加痛苦</text>
  <text class="t" x="340" y="220" font-size="10" fill="#f87171">· 空间不足自动翻转</text>
  <text class="t" x="340" y="238" font-size="10" fill="#f87171">· 菜单宽度和触发器对齐</text>
  <text class="t" x="340" y="256" font-size="10" fill="#f87171">· overflow:hidden 被裁切</text>
  <text class="t" x="340" y="278" font-size="10" fill="#94a3b8">每个都需要中间件：</text>
  <text class="t" x="340" y="296" font-size="10" fill="#94a3b8">Popper.js / Floating UI</text>
  <text class="t" x="340" y="314" font-size="10" fill="#94a3b8">一卸载就漏清理</text>
  <text class="t" x="64" y="362" font-size="13" font-weight="bold" fill="#f87171">「几何关系明明是声明式的，非要写成命令式？」</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">?</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 名字绑定 + 布局期跟随</text>
  <rect x="648" y="176" width="250" height="170" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="662" y="198" font-size="12" font-weight="bold" fill="#22d3ee">建立锚</text>
  <text class="m" x="662" y="218" font-size="10" fill="#cbd5e1">#btn {</text>
  <text class="m" x="662" y="234" font-size="10" fill="#cbd5e1">  anchor-name: --tip;</text>
  <text class="m" x="662" y="250" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="662" y="270" font-size="12" font-weight="bold" fill="#22d3ee">漂浮物绑定</text>
  <text class="m" x="662" y="290" font-size="10" fill="#cbd5e1">.tooltip {</text>
  <text class="m" x="662" y="306" font-size="10" fill="#cbd5e1">  position-anchor: --tip;</text>
  <text class="m" x="662" y="322" font-size="10" fill="#cbd5e1">  bottom: anchor(top); }</text>
  <rect x="914" y="176" width="230" height="170" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="928" y="198" font-size="12" font-weight="bold" fill="#a78bfa">高级工具箱</text>
  <text class="t" x="928" y="220" font-size="10" fill="#fbbf24">position-area: bottom</text>
  <text class="t" x="928" y="238" font-size="10" fill="#94a3b8">九宫格直觉派，对齐自动</text>
  <text class="t" x="928" y="256" font-size="10" fill="#fbbf24">position-try: flip-block</text>
  <text class="t" x="928" y="274" font-size="10" fill="#94a3b8">空间不足自动翻转到对面</text>
  <text class="t" x="928" y="292" font-size="10" fill="#fbbf24">anchor-size(width)</text>
  <text class="t" x="928" y="310" font-size="10" fill="#94a3b8">菜单至少与触发器等宽</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">「布局引擎逐帧跟随，零 JS、零抖动、合成器级跟手」</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 四大实战场景</text>
  <!-- tooltip -->
  <rect x="64" y="440" width="250" height="160" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#22d3ee">Tooltip 正上方居中</text>
  <text class="m" x="78" y="484" font-size="10" fill="#cbd5e1">bottom: anchor(top);</text>
  <text class="m" x="78" y="500" font-size="10" fill="#cbd5e1">justify-self: anchor-center;</text>
  <text class="t" x="78" y="524" font-size="10" fill="#94a3b8">不需要 JS 监听 scroll</text>
  <text class="t" x="78" y="542" font-size="10" fill="#94a3b8">容器再深也能穿出</text>
  <text class="t" x="78" y="560" font-size="10" fill="#94a3b8">只做几何，不管层叠</text>
  <text class="t" x="78" y="578" font-size="10" fill="#fbbf24">⚠ 管位置不管 z-index</text>
  <!-- 下拉菜单 -->
  <rect x="330" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="344" y="462" font-size="12" font-weight="bold" fill="#a78bfa">下拉菜单等宽</text>
  <text class="m" x="344" y="484" font-size="10" fill="#cbd5e1">position-area: bottom</text>
  <text class="m" x="344" y="500" font-size="10" fill="#cbd5e1">  span-right;</text>
  <text class="m" x="344" y="516" font-size="10" fill="#cbd5e1">min-width: anchor-size(width);</text>
  <text class="t" x="344" y="540" font-size="10" fill="#94a3b8">宽度自动对齐触发器</text>
  <text class="t" x="344" y="558" font-size="10" fill="#94a3b8">margin 控制间距</text>
  <!-- 防溢出翻转 -->
  <rect x="586" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text class="t" x="600" y="462" font-size="12" font-weight="bold" fill="#fbbf24">防溢出自动翻转</text>
  <text class="m" x="600" y="484" font-size="10" fill="#cbd5e1">position-try: flip-block</text>
  <text class="m" x="600" y="500" font-size="10" fill="#cbd5e1">  flip-inline;</text>
  <text class="t" x="600" y="524" font-size="10" fill="#94a3b8">下方放不下翻上方</text>
  <text class="t" x="600" y="542" font-size="10" fill="#94a3b8">左方放不下翻右方</text>
  <text class="t" x="600" y="560" font-size="10" fill="#fbbf24">布局期决策，切换无动画</text>
  <!-- 角标/标注 -->
  <rect x="842" y="440" width="302" height="160" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="856" y="462" font-size="12" font-weight="bold" fill="#f472b6">角标与连线标注</text>
  <text class="m" x="856" y="484" font-size="10" fill="#cbd5e1">position-area: top right;</text>
  <text class="m" x="856" y="500" font-size="10" fill="#cbd5e1">translate: 50% -50%;</text>
  <text class="t" x="856" y="524" font-size="10" fill="#94a3b8">徽标骑在角落上</text>
  <text class="t" x="856" y="542" font-size="10" fill="#94a3b8">多锚协作可画连线</text>
  <text class="t" x="856" y="560" font-size="10" fill="#fbbf24">Chrome 125+ / Safari 26+</text>
  <text class="t" x="856" y="578" font-size="10" fill="#94a3b8">Firefox 开发中</text>
  <path d="M 552 428 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fbbf24"/>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
