  <text class="t kb" x="266" y="708">三种阴影三种轮廓：box-shadow 矩形、text-shadow 字形、drop-shadow 实际 alpha 剪影</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">多层阴影先细后粗（先写的在上层）；透明度控制在 6%~14% 不发脏</text>
