  <text class="m cd" x="596" y="470" fill="#f87171">/* 别逐帧改 box-shadow —— 必然重绘 */</text>
  <text class="m cd" x="596" y="492">.card { transition: transform .2s; }</text>
  <text class="m cd" x="596" y="514">.card:hover {</text>
  <text class="m cd" x="596" y="532" fill="#22d3ee">  transform: translateY(-4px); }</text>
  <text class="m cd" x="596" y="556" fill="#64748b">/* 明暗变化 → 伪元素 opacity */</text>
  <text class="m cd" x="596" y="576">.card::after { opacity: 1 }</text>
  <text class="t" x="930" y="458" font-size="10.5" fill="#94a3b8">绘制成本</text>
  <rect x="930" y="470" width="56" height="18" rx="3" fill="#f87171"/>
  <text class="t" x="996" y="484" font-size="10.5" fill="#f87171">改 shadow 值 · 28fps</text>
  <rect x="930" y="510" width="56" height="34" rx="3" fill="#22d3ee"/>
  <text class="t" x="996" y="530" font-size="10.5" fill="#22d3ee">transform 接管 · 60fps</text>
  <text class="t" x="930" y="566" font-size="10.5" fill="#64748b">will-change 克制用——</text>
  <text class="t" x="930" y="584" font-size="10.5" fill="#64748b">只提升动画容器</text>
