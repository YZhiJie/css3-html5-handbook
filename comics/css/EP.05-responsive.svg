  <text class="m" x="860" y="234" font-size="10.5" fill="#cbd5e1">        1fr; }</text>
  <text class="m" x="860" y="252" font-size="10.5" fill="#22d3ee">@media (min-width: 48em) {</text>
  <text class="m" x="860" y="270" font-size="10.5" fill="#cbd5e1">  .grid { grid-template-columns:</text>
