  <rect x="0" y="0" width="1200" height="840" fill="#0b1220"/>

  <!-- ===== 顶部横幅 ===== -->
  <rect x="40" y="6" width="120" height="6" rx="3" fill="#22d3ee"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#f472b6"/>
  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · CSS 篇</text>
  <text class="t bt" x="40" y="80">第 28 话 · CSS 嵌套 — 规则套规则</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.28</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 扁平 CSS 的重复与散落</text>
  <rect x="64" y="176" width="248" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="78" y="198" font-size="12" font-weight="bold" fill="#f87171">传统写法：父选择器反复书写</text>
  <text class="m" x="78" y="220" font-size="10" fill="#cbd5e1">.card { padding: 16px; }</text>
  <text class="m" x="78" y="236" font-size="10" fill="#cbd5e1">.card .title { font-size: 18px; }</text>
  <text class="m" x="78" y="252" font-size="10" fill="#cbd5e1">.card .title:hover { color: blue; }</text>
  <text class="m" x="78" y="268" font-size="10" fill="#cbd5e1">.card.featured { border: gold; }</text>
  <text class="t" x="78" y="292" font-size="10" fill="#f87171">.card 写了 4 遍，改名要全局替换</text>
  <text class="t" x="78" y="310" font-size="10" fill="#94a3b8">同一组件的规则间隔几十行</text>
  <rect x="326" y="176" width="246" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="340" y="198" font-size="12" font-weight="bold" fill="#94a3b8">预处理器依赖</text>
  <text class="t" x="340" y="220" font-size="10" fill="#f87171">· 引入 Sass / Less 工具链</text>
  <text class="t" x="340" y="238" font-size="10" fill="#f87171">· node_modules +30MB</text>
  <text class="t" x="340" y="256" font-size="10" fill="#f87171">· HMR 多一层编译</text>
  <text class="t" x="340" y="278" font-size="10" fill="#94a3b8">CSS 原生不支持「规则套规则」</text>
  <text class="t" x="340" y="296" font-size="10" fill="#94a3b8">团队成员必须先学预处理器语法</text>
  <text class="t" x="340" y="314" font-size="10" fill="#94a3b8">源码与调试产物中间隔一层编译</text>
  <text class="t" x="64" y="362" font-size="13" font-weight="bold" fill="#f87171">「有没有不用预处理器就能嵌套的办法？」</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">?</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 规则套规则，&amp; 引用父选择器</text>
  <rect x="648" y="176" width="250" height="170" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="662" y="198" font-size="12" font-weight="bold" fill="#22d3ee">嵌套写法</text>
  <text class="m" x="662" y="218" font-size="10" fill="#cbd5e1">.card {</text>
  <text class="m" x="662" y="234" font-size="10" fill="#cbd5e1">  padding: 16px;</text>
  <text class="m" x="662" y="250" font-size="10" fill="#cbd5e1">  .title { font-size: 18px; }</text>
  <text class="m" x="662" y="266" font-size="10" fill="#cbd5e1">  .title:hover { color: blue; }</text>
  <text class="m" x="662" y="282" font-size="10" fill="#cbd5e1">  &amp;.featured { border: gold; }</text>
  <text class="m" x="662" y="298" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="662" y="320" font-size="10" fill="#22d3ee">浏览器解析期展开，与手写完全等价</text>
  <rect x="914" y="176" width="230" height="170" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="928" y="198" font-size="12" font-weight="bold" fill="#a78bfa">&amp; 的用法</text>
  <text class="m" x="928" y="218" font-size="10" fill="#cbd5e1">&amp;:hover         /* 同元素伪类 */</text>
  <text class="m" x="928" y="234" font-size="10" fill="#cbd5e1">&amp;.featured      /* 同元素状态 */</text>
  <text class="m" x="928" y="250" font-size="10" fill="#cbd5e1">&amp;.primary:hover /* 复合状态 */</text>
  <text class="m" x="928" y="266" font-size="10" fill="#cbd5e1">.card &amp;          /* 祖先条件 */</text>
  <text class="m" x="928" y="282" font-size="10" fill="#cbd5e1">@media {}        /* 嵌套断点 */</text>
  <text class="t" x="928" y="304" font-size="10" fill="#fbbf24">Sass 用户几乎零学习成本</text>
  <text class="t" x="928" y="322" font-size="10" fill="#fbbf24">展开后特异性不变</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">「结构即文档，一个块内收拢组件全部样式」</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 四大实战场景</text>
  <!-- 按钮全状态 -->
  <rect x="64" y="440" width="250" height="160" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#22d3ee">按钮全状态收拢</text>
  <text class="m" x="78" y="484" font-size="10" fill="#cbd5e1">.btn {</text>
  <text class="m" x="78" y="500" font-size="10" fill="#cbd5e1">  &amp;:hover { }</text>
  <text class="m" x="78" y="516" font-size="10" fill="#cbd5e1">  &amp;:focus-visible { }</text>
  <text class="m" x="78" y="532" font-size="10" fill="#cbd5e1">  &amp;.primary:hover { }</text>
  <text class="m" x="78" y="548" font-size="10" fill="#cbd5e1">  &amp;.danger:hover { }</text>
  <text class="m" x="78" y="564" font-size="10" fill="#cbd5e1">}</text>
  <!-- 响应式 -->
  <rect x="330" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="344" y="462" font-size="12" font-weight="bold" fill="#a78bfa">响应式跟着组件走</text>
  <text class="m" x="344" y="484" font-size="10" fill="#cbd5e1">.sidebar {</text>
  <text class="m" x="344" y="500" font-size="10" fill="#cbd5e1">  width: 280px;</text>
  <text class="m" x="344" y="516" font-size="10" fill="#cbd5e1">  @media (max-width: 768px) {</text>
  <text class="m" x="344" y="532" font-size="10" fill="#cbd5e1">    width: 100%;</text>
  <text class="m" x="344" y="548" font-size="10" fill="#cbd5e1">  }</text>
  <text class="m" x="344" y="564" font-size="10" fill="#cbd5e1">}</text>
  <!-- 祖先条件 -->
  <rect x="586" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text class="t" x="600" y="462" font-size="12" font-weight="bold" fill="#fbbf24">祖先条件反向写</text>
  <text class="m" x="600" y="484" font-size="10" fill="#cbd5e1">.title {</text>
  <text class="m" x="600" y="500" font-size="10" fill="#cbd5e1">  [data-theme=dark] &amp; {</text>
  <text class="m" x="600" y="516" font-size="10" fill="#cbd5e1">    color: white;</text>
  <text class="m" x="600" y="532" font-size="10" fill="#cbd5e1">  }</text>
  <text class="m" x="600" y="548" font-size="10" fill="#fbbf24">  /* 展开为 */</text>
  <text class="m" x="600" y="564" font-size="10" fill="#fbbf24">  /* [data-theme=dark] .title */</text>
  <!-- 表单组合 -->
  <rect x="842" y="440" width="302" height="160" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="856" y="462" font-size="12" font-weight="bold" fill="#f472b6">嵌套 + :has 零 JS 表单</text>
  <text class="m" x="856" y="484" font-size="10" fill="#cbd5e1">.field {</text>
  <text class="m" x="856" y="500" font-size="10" fill="#cbd5e1">  input { &amp;:focus { } }</text>
  <text class="m" x="856" y="516" font-size="10" fill="#cbd5e1">  .error-msg { display: none; }</text>
  <text class="m" x="856" y="532" font-size="10" fill="#cbd5e1">  &amp;:has(input:invalid) .error-msg</text>
  <text class="m" x="856" y="548" font-size="10" fill="#cbd5e1">    { display: block; }</text>
  <text class="m" x="856" y="564" font-size="10" fill="#cbd5e1">}</text>
  <text class="m" x="856" y="588" font-size="10" fill="#fbbf24">/* Chrome 112+ / Safari 16.5+ / FF 117+ */</text>
