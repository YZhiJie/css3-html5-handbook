  <rect x="0" y="0" width="1200" height="840" fill="#0b1220"/>

  <!-- ===== 顶部横幅 ===== -->
  <rect x="40" y="6" width="120" height="6" rx="3" fill="#22d3ee"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#f472b6"/>
  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · CSS 篇</text>
  <text class="t bt" x="40" y="80">第 35 话 · 滚动吸附 — 松手即停稳</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.35</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 滚动停在半中间</text>
  <rect x="64" y="176" width="248" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="78" y="198" font-size="12" font-weight="bold" fill="#f87171">JS 手动校正落点</text>
  <text class="m" x="78" y="220" font-size="10" fill="#cbd5e1">addEventListener('scroll',</text>
  <text class="m" x="78" y="238" font-size="10" fill="#cbd5e1">  debounce(() =&gt; {</text>
  <text class="m" x="78" y="256" font-size="10" fill="#cbd5e1">    scrollTo({left: near})</text>
  <text class="m" x="78" y="274" font-size="10" fill="#cbd5e1">  }))</text>
  <text class="t" x="78" y="296" font-size="10" fill="#f87171">swiper 库几十 KB</text>
  <text class="t" x="78" y="314" font-size="10" fill="#94a3b8">触摸惯性全靠 JS 模拟</text>
  <rect x="326" y="176" width="246" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="340" y="198" font-size="12" font-weight="bold" fill="#94a3b8">叠加痛苦</text>
  <text class="t" x="340" y="220" font-size="10" fill="#f87171">· 停在两张图中间</text>
  <text class="t" x="340" y="238" font-size="10" fill="#f87171">· 一甩跳过三张卡</text>
  <text class="t" x="340" y="256" font-size="10" fill="#f87171">· 固定头遮挡落点</text>
  <text class="t" x="340" y="278" font-size="10" fill="#94a3b8">低端机滚动手感差</text>
  <text class="t" x="340" y="296" font-size="10" fill="#94a3b8">JS 禁用时完全失效</text>
  <text class="t" x="64" y="362" font-size="13" font-weight="bold" fill="#f87171">「惯性、方向、落点全靠 JS 算 —— 手感永远差一口气」</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">?</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 容器定规则 子项给落点</text>
  <rect x="648" y="176" width="250" height="170" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="662" y="198" font-size="12" font-weight="bold" fill="#22d3ee">scroll-snap-type（容器）</text>
  <text class="m" x="662" y="218" font-size="10" fill="#cbd5e1">.row {</text>
  <text class="m" x="662" y="234" font-size="10" fill="#cbd5e1">  overflow-x: auto;</text>
  <text class="m" x="662" y="250" font-size="10" fill="#cbd5e1">  scroll-snap-type:</text>
  <text class="m" x="662" y="266" font-size="10" fill="#cbd5e1">    x mandatory;</text>
  <text class="m" x="662" y="282" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="662" y="304" font-size="10" fill="#94a3b8">方向 x/y/both</text>
  <text class="t" x="662" y="322" font-size="10" fill="#94a3b8">严格度 mandatory/proximity</text>
  <rect x="914" y="176" width="230" height="170" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="928" y="198" font-size="12" font-weight="bold" fill="#a78bfa">scroll-snap-align（子项）</text>
  <text class="m" x="928" y="220" font-size="10" fill="#cbd5e1">.card {</text>
  <text class="m" x="928" y="236" font-size="10" fill="#cbd5e1">  scroll-snap-align: center;</text>
  <text class="m" x="928" y="252" font-size="10" fill="#cbd5e1">  scroll-snap-stop: always;</text>
  <text class="m" x="928" y="268" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="928" y="290" font-size="10" fill="#94a3b8">start / center / end 落点</text>
  <text class="t" x="928" y="308" font-size="10" fill="#94a3b8">stop: always 逐项停靠</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">「浏览器接管惯性与落点 —— 松手即吸到最近吸附点」</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 四大实战场景</text>
  <!-- 水平卡片流 -->
  <rect x="64" y="440" width="250" height="160" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#22d3ee">水平卡片流</text>
  <text class="m" x="78" y="484" font-size="10" fill="#cbd5e1">x mandatory + center</text>
  <text class="t" x="78" y="508" font-size="10" fill="#94a3b8">松手自动居中卡片</text>
  <text class="t" x="78" y="526" font-size="10" fill="#94a3b8">原生惯性 60fps</text>
  <text class="t" x="78" y="544" font-size="10" fill="#fbbf24">⚠ scroll-padding-inline</text>
  <text class="t" x="78" y="562" font-size="10" fill="#94a3b8">首尾卡片也能居中</text>
  <!-- 整屏翻页 -->
  <rect x="330" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="344" y="462" font-size="12" font-weight="bold" fill="#a78bfa">整屏翻页</text>
  <text class="m" x="344" y="484" font-size="10" fill="#cbd5e1">y mandatory</text>
  <text class="m" x="344" y="500" font-size="10" fill="#cbd5e1">stop: always</text>
  <text class="t" x="344" y="524" font-size="10" fill="#94a3b8">一屏一停不连跳</text>
  <text class="t" x="344" y="542" font-size="10" fill="#94a3b8">landing 页 100vh 标配</text>
  <!-- 纯 CSS 轮播 -->
  <rect x="586" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text class="t" x="600" y="462" font-size="12" font-weight="bold" fill="#fbbf24">纯 CSS 轮播</text>
  <text class="m" x="600" y="484" font-size="10" fill="#cbd5e1">scroll-behavior: smooth</text>
  <text class="m" x="600" y="500" font-size="10" fill="#cbd5e1">&lt;a href="#s2"&gt; 锚点</text>
  <text class="t" x="600" y="524" font-size="10" fill="#94a3b8">圆点导航零 JS</text>
  <text class="t" x="600" y="542" font-size="10" fill="#94a3b8">落点仍由吸附接管</text>
  <!-- mandatory vs proximity -->
  <rect x="842" y="440" width="302" height="160" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="856" y="462" font-size="12" font-weight="bold" fill="#f472b6">mandatory vs proximity</text>
  <text class="m" x="856" y="484" font-size="10" fill="#cbd5e1">内容不定高用 proximity</text>
  <text class="t" x="856" y="508" font-size="10" fill="#94a3b8">mandatory 会抢滚动锁死</text>
  <text class="t" x="856" y="526" font-size="10" fill="#94a3b8">高过一屏的内容滚不到</text>
  <text class="t" x="856" y="544" font-size="10" fill="#fbbf24">Chrome 69+ / Safari 14.1+</text>
  <text class="t" x="856" y="562" font-size="10" fill="#94a3b8">Firefox 68+ 早已全绿</text>
  <path d="M 552 428 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fbbf24"/>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">容器 scroll-snap-type 定方向与严格度，子项 scroll-snap-align 给吸附点</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">mandatory 强制吸附；内容不定高时用 proximity，否则中间内容滚不到</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">固定头遮落点：容器补 scroll-padding-top，scrollIntoView 同样生效</text>
