  <rect x="864" y="440" width="280" height="150" rx="12" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="880" y="462" font-size="10" fill="#64748b">/* 卡片组件源码（一处定义） */</text>
  <text class="m" x="880" y="480" font-size="10" fill="#cbd5e1">.card-wrapper {</text>
  <text class="m" x="880" y="496" font-size="10" fill="#cbd5e1">  container: card / inline-size;</text>
  <text class="m" x="880" y="512" font-size="10" fill="#22d3ee">}</text>
  <text class="m" x="880" y="530" font-size="10" fill="#a78bfa">@container card (min-width: 400px) {</text>
  <text class="m" x="880" y="546" font-size="10" fill="#cbd5e1">  .card { flex-direction: row; }</text>
  <text class="m" x="880" y="562" font-size="10" fill="#a78bfa">}</text>
