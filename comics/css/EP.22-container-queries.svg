  <text class="t pt" x="668" y="152">机制登场 · container-type + @container</text>
  <!-- 容器声明 -->
  <rect x="648" y="176" width="280" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="660" y="196" font-size="11" fill="#22d3ee">.card-wrapper {</text>
  <text class="m" x="660" y="214" font-size="11" fill="#cbd5e1">  container: card / inline-size;</text>
  <text class="m" x="660" y="230" font-size="11" fill="#22d3ee">}</text>
  <!-- 查询语法 -->
  <rect x="648" y="244" width="280" height="60" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="m" x="660" y="264" font-size="11" fill="#a78bfa">@container card (min-width: 400px) {</text>
  <text class="m" x="660" y="282" font-size="11" fill="#cbd5e1">  .card { flex-direction: row; }</text>
  <text class="m" x="660" y="298" font-size="11" fill="#a78bfa">}</text>
  <!-- 右侧：容器单位 -->
  <rect x="944" y="176" width="200" height="128" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="960" y="198" font-size="12" font-weight="bold" fill="#fbbf24">容器单位</text>
  <text class="m" x="960" y="220" font-size="11" fill="#cbd5e1">1cqi = 容器宽 1%</text>
  <text class="m" x="960" y="238" font-size="11" fill="#cbd5e1">1cqw = 容器宽 1%</text>
  <text class="m" x="960" y="256" font-size="11" fill="#cbd5e1">1cqh = 容器高 1%</text>
  <text class="m" x="960" y="274" font-size="11" fill="#cbd5e1">cqmin / cqmax</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">组件自带断点，消费者零媒体查询</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

