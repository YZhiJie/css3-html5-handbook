  <text class="m" x="516" y="458" font-size="13" font-weight="bold" fill="#a78bfa">animation · 主动时间线</text>
  <circle cx="532" cy="506" r="8" fill="#22d3ee"/>
  <circle cx="562" cy="494" r="8" fill="#22d3ee"/>
  <circle cx="592" cy="506" r="8" fill="#22d3ee"/>
  <text class="m cd" x="616" y="498">animation: bounce .9s infinite alternate;</text>
  <text class="m cd" x="616" y="518">@keyframes bounce { to { transform: ... } }</text>
  <text class="t an" x="516" y="552">三点加载：同一个 keyframes，负 delay 错相</text>
  <text class="t an" x="516" y="574">fill-mode: both 防首尾闪帧；入场 ease-out 离场 ease-in</text>
