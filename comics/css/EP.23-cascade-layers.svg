  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · CSS 篇</text>
  <text class="t bt" x="40" y="80">第 23 话 · 层叠层 — @layer 终结 !important 战争</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.23</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · !important 军备竞赛</text>
  <rect x="76" y="176" width="220" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="m" x="90" y="198" font-size="10" fill="#f87171">/* 框架代码 */</text>
  <text class="m" x="90" y="216" font-size="10" fill="#cbd5e1">.btn { background: blue !important; }</text>
  <text class="m" x="90" y="240" font-size="10" fill="#f87171">/* 业务覆盖 */</text>
  <text class="m" x="90" y="258" font-size="10" fill="#cbd5e1">.page .btn { background: red !important; }</text>
  <text class="m" x="90" y="282" font-size="10" fill="#f87171">/* 再覆盖 */</text>
  <text class="m" x="90" y="300" font-size="10" fill="#cbd5e1">#app .page .btn { background: green !important; }</text>
  <text class="t" x="90" y="328" font-size="11" fill="#f87171">特异性 (1,2,0) vs (1,1,0) vs (0,1,0)</text>
  <rect x="316" y="176" width="240" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="330" y="198" font-size="11" font-weight="bold" fill="#94a3b8">覆盖成本递增</text>
  <text class="m" x="330" y="222" font-size="10" fill="#64748b">第1次: .btn → (0,1,0)</text>
  <text class="m" x="330" y="242" font-size="10" fill="#fbbf24">第2次: .page .btn → (0,2,0)</text>
  <text class="m" x="330" y="262" font-size="10" fill="#f472b6">第3次: #app .page .btn → (1,2,0)</text>
  <text class="m" x="330" y="282" font-size="10" fill="#f87171">第4次: ??? → !important</text>
  <text class="t" x="330" y="310" font-size="11" fill="#f87171">DOM 一改，全盘崩</text>
  <text class="t" x="76" y="356" font-size="13" font-weight="bold" fill="#f87171">特异性竞赛的终点永远是 !important</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">!</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · @layer 显式分层</text>
  <rect x="648" y="176" width="260" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="m" x="660" y="198" font-size="10" fill="#64748b">/* 层声明顺序 = 优先级 */</text>
  <text class="m" x="660" y="216" font-size="10" fill="#22d3ee">@layer reset, base, components,</text>
  <text class="m" x="660" y="232" font-size="10" fill="#22d3ee">        utilities, overrides;</text>
  <text class="m" x="660" y="254" font-size="10" fill="#cbd5e1">@layer reset { margin: 0; }</text>
  <text class="m" x="660" y="272" font-size="10" fill="#cbd5e1">@layer base { body { ... } }</text>
  <text class="m" x="660" y="290" font-size="10" fill="#cbd5e1">@layer components { .btn { ... } }</text>
  <text class="m" x="660" y="308" font-size="10" fill="#f472b6">@layer utilities { .text-center { ... } }</text>
  <text class="m" x="660" y="326" font-size="10" fill="#fbbf24">/* 未分层 = 最高优先级 */</text>
  <rect x="924" y="176" width="220" height="160" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="938" y="198" font-size="12" font-weight="bold" fill="#a78bfa">层叠决胜顺序</text>
  <text class="t" x="938" y="222" font-size="11" fill="#cbd5e1">1. 来源与重要性</text>
  <text class="t" x="938" y="242" font-size="11" fill="#cbd5e1">2. @layer 层顺序</text>
  <text class="t" x="938" y="262" font-size="11" fill="#cbd5e1">3. 特异性</text>
  <text class="t" x="938" y="282" font-size="11" fill="#cbd5e1">4. 出现顺序</text>
  <text class="t" x="938" y="310" font-size="11" fill="#a78bfa">层 ＞ 特异性：低层 !important</text>
  <text class="t" x="938" y="326" font-size="11" fill="#a78bfa">也赢不了高层普通规则</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">层顺序是架构决策，不是巧合</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 五层架构 + !important 逆序</text>
  <!-- 左侧：五层可视化 -->
  <rect x="64" y="440" width="200" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#fbbf24">五层架构</text>
  <rect x="78" y="474" width="172" height="24" rx="4" fill="#64748b"/>
  <text class="t" x="164" y="490" text-anchor="middle" font-size="10" fill="#fff">reset</text>
  <rect x="78" y="502" width="172" height="24" rx="4" fill="#22d3ee"/>
  <text class="t" x="164" y="518" text-anchor="middle" font-size="10" fill="#0b1220">base</text>
  <rect x="78" y="530" width="172" height="24" rx="4" fill="#a78bfa"/>
  <text class="t" x="164" y="546" text-anchor="middle" font-size="10" fill="#0b1220">components</text>
  <rect x="78" y="558" width="172" height="24" rx="4" fill="#f472b6"/>
  <text class="t" x="164" y="574" text-anchor="middle" font-size="10" fill="#0b1220">utilities</text>
  <rect x="78" y="586" width="172" height="24" rx="4" fill="#fbbf24"/>
  <text class="t" x="164" y="602" text-anchor="middle" font-size="10" fill="#451a03">未分层（最高）</text>
  <!-- 中间：覆盖示例 -->
  <rect x="284" y="440" width="300" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="298" y="462" font-size="12" font-weight="bold" fill="#f472b6">覆盖示例</text>
  <text class="m" x="298" y="484" font-size="10" fill="#64748b">/* utilities 层（Tailwind）*/</text>
  <text class="m" x="298" y="502" font-size="10" fill="#cbd5e1">.text-lg { font-size: 18px !important; }</text>
  <text class="m" x="298" y="526" font-size="10" fill="#64748b">/* overrides 层（业务）*/</text>
  <text class="m" x="298" y="544" font-size="10" fill="#f472b6">.product-title { font-size: 24px; }</text>
  <text class="t" x="298" y="570" font-size="11" fill="#22d3ee">✓ 普通规则覆盖 !important</text>
  <text class="t" x="298" y="590" font-size="11" fill="#94a3b8">因为 overrides 层序 ＞ utilities 层序</text>
  <!-- 右侧：!important 逆序 -->
  <rect x="604" y="440" width="280" height="160" rx="12" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="618" y="462" font-size="12" font-weight="bold" fill="#f87171">!important 逆序</text>
  <text class="m" x="618" y="484" font-size="10" fill="#cbd5e1">@layer base { color: red !important; }</text>
  <text class="m" x="618" y="502" font-size="10" fill="#cbd5e1">@layer utilities { color: green !important; }</text>
  <text class="t" x="618" y="526" font-size="11" fill="#f87171">结果：红色（base 赢）</text>
  <text class="t" x="618" y="546" font-size="11" fill="#94a3b8">分层规则中 !important 按层逆序</text>
  <text class="t" x="618" y="566" font-size="11" fill="#94a3b8">防止工具层用 !important 封死下层</text>
  <text class="t" x="618" y="590" font-size="11" fill="#fbbf24">⚠ 滥用 !important 时层也救不了你</text>
  <!-- 右侧代码 -->
  <rect x="904" y="440" width="240" height="160" rx="12" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="918" y="462" font-size="10" fill="#64748b">/* 嵌套层 */</text>
  <text class="m" x="918" y="480" font-size="10" fill="#cbd5e1">@layer framework {</text>
  <text class="m" x="918" y="496" font-size="10" fill="#cbd5e1">  @layer reset { ... }</text>
  <text class="m" x="918" y="512" font-size="10" fill="#cbd5e1">  @layer components { ... }</text>
  <text class="m" x="918" y="528" font-size="10" fill="#22d3ee">}</text>
  <text class="m" x="918" y="546" font-size="10" fill="#64748b">/* @import 指定层 */</text>
  <text class="m" x="918" y="564" font-size="10" fill="#cbd5e1">@import "tw.css" layer(tw);</text>
