  <text class="t kb" x="266" y="708">transform 不碰文档流：位移后仍占原位，动画只走合成器，主线程卡顿也不掉帧</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">函数从左到右依次相乘、顺序敏感；拼 3D 口诀：先转正、再推出</text>
