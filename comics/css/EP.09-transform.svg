  <text class="t" x="556" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">!</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 顺序就是矩阵乘法</text>

  <rect x="640" y="170" width="205" height="108" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="m" x="656" y="194" font-size="11.5" fill="#c4b5fd">translateX(80px)</text>
  <text class="m" x="656" y="214" font-size="11.5" fill="#c4b5fd">rotate(45deg)</text>
  <line x1="656" y1="226" x2="829" y2="226" stroke="#334155" stroke-width="1.5"/>
  <text class="t an" x="656" y="246">① 先沿原 X 轴右移</text>
  <text class="t an" x="656" y="266">② 再绕中心旋转 45°</text>

  <text class="t" x="852" y="234" text-anchor="middle" font-size="26" font-weight="bold" fill="#f472b6">≠</text>

  <rect x="863" y="170" width="205" height="108" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="m" x="879" y="194" font-size="11.5" fill="#f9a8d4">rotate(45deg)</text>
  <text class="m" x="879" y="214" font-size="11.5" fill="#f9a8d4">translateX(80px)</text>
  <line x1="879" y1="226" x2="1052" y2="226" stroke="#334155" stroke-width="1.5"/>
  <text class="t an" x="879" y="246">① 先旋转，X 轴被带斜</text>
  <text class="t an" x="879" y="266">② 再沿新 X 轴斜着推</text>

  <text class="t an" x="640" y="300">函数从左到右依次相乘，矩阵乘法不可交换</text>
  <text class="m" x="640" y="326" font-size="11.5" fill="#22d3ee">.box { transform-origin: 50% 50%; }</text>
  <text class="t an" x="640" y="350">translate 百分比基于自身尺寸——无宽高也能精确居中</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
