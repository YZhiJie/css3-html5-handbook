  <polygon points="186,216 192,220 186,224" fill="#f87171"/>
  <rect x="190" y="206" width="104" height="28" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text class="t" x="242" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#fecaca">Paint 重绘</text>
