  <polygon points="312,216 318,220 312,224" fill="#f87171"/>
  <rect x="316" y="206" width="120" height="28" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text class="t" x="376" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#fecaca">Composite</text>

  <rect x="64" y="246" width="400" height="30" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="m" x="78" y="266" font-size="11.5" fill="#67e8f9">动画 transform: translateX(200px)（GPU 合成）</text>
  <rect x="64" y="284" width="104" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text class="t" x="116" y="303" text-anchor="middle" font-size="12" fill="#475569">Layout</text>
  <rect x="190" y="284" width="104" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text class="t" x="242" y="303" text-anchor="middle" font-size="12" fill="#475569">Paint</text>
  <rect x="316" y="284" width="120" height="28" rx="8" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="t" x="376" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#67e8f9">Composite 合成</text>

  <text class="t" x="64" y="326" font-size="13" font-weight="bold" fill="#f87171">同样位移 200px：一个每帧重排，一个只走合成器</text>
  <text class="t an" x="64" y="350">left/top/width 触发 Layout；transform 由合成器线程更新矩阵</text>
