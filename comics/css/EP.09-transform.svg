  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 位移动画为什么卡</text>

  <rect x="64" y="168" width="400" height="30" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text class="m" x="78" y="188" font-size="11.5" fill="#fca5a5">动画 left: 0px → 200px（每帧重排）</text>
