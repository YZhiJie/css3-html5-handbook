  <text class="m" x="170" y="522" text-anchor="middle" font-size="9.5" fill="#94a3b8">rotateY(0)</text>
  <text class="m" x="184" y="598" text-anchor="middle" font-size="11" fill="#22d3ee">perspective: 900px（舞台）</text>

  <rect x="400" y="440" width="225" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="426" cy="466" r="13" fill="#22d3ee"/>
  <text class="m" x="426" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">1</text>
  <text class="t" x="448" y="471" font-size="15" font-weight="bold" fill="#f8fafc">舞台 · perspective</text>
  <rect x="414" y="486" width="197" height="30" rx="6" fill="#0b1220"/>
  <text class="m" x="424" y="506" font-size="10.5" fill="#22d3ee">perspective: 900px;</text>
  <text class="t an" x="414" y="538" font-size="11.5">写在父元素，全部子面</text>
  <text class="t an" x="414" y="558" font-size="11.5">共享一个灭点，不散架</text>
  <line x1="631" y1="510" x2="642" y2="510" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="642,506 648,510 642,514" fill="#94a3b8"/>

  <rect x="648" y="440" width="225" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="674" cy="466" r="13" fill="#a78bfa"/>
  <text class="m" x="674" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">2</text>
  <text class="t" x="696" y="471" font-size="15" font-weight="bold" fill="#f8fafc">中层 · preserve-3d</text>
  <rect x="662" y="486" width="197" height="30" rx="6" fill="#0b1220"/>
  <text class="m" x="672" y="506" font-size="10.5" fill="#c4b5fd">transform-style: preserve-3d;</text>
  <text class="t an" x="662" y="538" font-size="11.5">默认 flat 把子元素</text>
  <text class="t an" x="662" y="558" font-size="11.5">拍到同一平面上</text>
  <line x1="879" y1="510" x2="890" y2="510" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="890,506 896,510 890,514" fill="#94a3b8"/>

  <rect x="896" y="440" width="240" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="922" cy="466" r="13" fill="#f472b6"/>
  <text class="m" x="922" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">3</text>
  <text class="t" x="944" y="471" font-size="15" font-weight="bold" fill="#f8fafc">面 · 藏起背面</text>
  <rect x="910" y="486" width="212" height="30" rx="6" fill="#0b1220"/>
  <text class="m" x="920" y="506" font-size="10.5" fill="#f9a8d4">backface-visibility: hidden;</text>
  <text class="t an" x="910" y="538" font-size="11.5">背面先 rotateY(180deg) 预翻</text>
  <text class="t an" x="910" y="558" font-size="11.5">翻过去正面隐、背面显</text>

  <text class="t an" x="400" y="604">坑：overflow:hidden、filter、opacity&lt;1 会强制打平 preserve-3d——3D 失效先查这批</text>

  <!-- ===== 知识条 ===== -->
