  <text class="t an" x="240" y="466">角度 = --p × 3.6deg</text>
  <text class="t an" x="240" y="486">第二个色标起点写 0</text>
  <text class="t an" x="240" y="506">自动从终点"接力"到 100%</text>
  <text class="m" x="240" y="536" font-size="11" fill="#22d3ee">el.style.setProperty('--p', 72)</text>
  <text class="m" x="64" y="584" font-size="11" fill="#22d3ee">conic-gradient(#22d3ee 0 calc(var(--p) * 3.6deg), #1e293b 0)</text>
