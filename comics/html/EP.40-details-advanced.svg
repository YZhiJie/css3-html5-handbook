  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · HTML 篇</text>
  <text class="t bt" x="40" y="80">第 40 话 · details 与 summary 进阶 — 原生折叠面板</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.40</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 手风琴组件库之殇</text>
  <rect x="64" y="176" width="248" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="78" y="198" font-size="12" font-weight="bold" fill="#f87171">引入 accordion 组件库</text>
  <text class="m" x="78" y="220" font-size="10" fill="#cbd5e1">import Accordion from 'lib'</text>
  <text class="m" x="78" y="238" font-size="10" fill="#cbd5e1">/* 15KB 包体积 */</text>
  <text class="m" x="78" y="256" font-size="10" fill="#cbd5e1">/* JS 控制互斥 */</text>
  <text class="m" x="78" y="274" font-size="10" fill="#cbd5e1">/* CSS height 动画 */</text>
  <text class="t" x="78" y="296" font-size="10" fill="#f87171">键盘/屏幕阅读器不支持</text>
  <text class="t" x="78" y="314" font-size="10" fill="#94a3b8">组件库主题定制困难</text>
  <rect x="326" y="176" width="246" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="340" y="198" font-size="12" font-weight="bold" fill="#94a3b8">叠加痛苦</text>
  <text class="t" x="340" y="220" font-size="10" fill="#f87171">· 包体积 +15KB</text>
  <text class="t" x="340" y="238" font-size="10" fill="#f87171">· 互斥逻辑手写 JS</text>
  <text class="t" x="340" y="256" font-size="10" fill="#f87171">· 高度动画需 JS 计算</text>
  <text class="t" x="340" y="278" font-size="10" fill="#94a3b8">SSR  hydration 闪动</text>
  <text class="t" x="340" y="296" font-size="10" fill="#94a3b8">可访问性全靠库</text>
  <text class="t" x="64" y="362" font-size="13" font-weight="bold" fill="#f87171">「FAQ 折叠、目录树、设置面板 —— 都要引一个组件库？」</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">?</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 原生双件套</text>
  <rect x="648" y="176" width="250" height="170" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="662" y="198" font-size="12" font-weight="bold" fill="#22d3ee">&lt;details&gt; 基础</text>
  <text class="m" x="662" y="218" font-size="10" fill="#cbd5e1">&lt;details open&gt;</text>
  <text class="m" x="662" y="234" font-size="10" fill="#cbd5e1">  &lt;summary&gt;标题&lt;/summary&gt;</text>
  <text class="m" x="662" y="250" font-size="10" fill="#cbd5e1">  &lt;p&gt;内容&lt;/p&gt;</text>
  <text class="m" x="662" y="266" font-size="10" fill="#cbd5e1">&lt;/details&gt;</text>
  <text class="t" x="662" y="290" font-size="10" fill="#94a3b8">零 JS 折叠面板</text>
  <text class="t" x="662" y="308" font-size="10" fill="#94a3b8">键盘/屏幕阅读器天然支持</text>
  <rect x="914" y="176" width="230" height="170" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="928" y="198" font-size="12" font-weight="bold" fill="#a78bfa">进阶三件套</text>
  <text class="m" x="928" y="218" font-size="10" fill="#cbd5e1">name="faq" 互斥</text>
  <text class="m" x="928" y="234" font-size="10" fill="#cbd5e1">::details-content 动画</text>
  <text class="m" x="928" y="250" font-size="10" fill="#cbd5e1">interpolate-size: allow</text>
  <text class="t" x="928" y="274" font-size="10" fill="#94a3b8">互斥手风琴零 JS</text>
  <text class="t" x="928" y="292" font-size="10" fill="#94a3b8">height: auto 平滑过渡</text>
  <text class="t" x="928" y="310" font-size="10" fill="#fbbf24">⚠ 新特性需渐进增强</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">「浏览器原生处理展开/收起/互斥 —— 组件库可以退役了」</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 四大实战场景</text>
  <!-- FAQ 手风琴 -->
  <rect x="64" y="440" width="250" height="160" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#22d3ee">FAQ 手风琴</text>
  <text class="m" x="78" y="484" font-size="10" fill="#cbd5e1">&lt;details name="faq"&gt;</text>
  <text class="t" x="78" y="508" font-size="10" fill="#94a3b8">相同 name 自动互斥</text>
  <text class="t" x="78" y="526" font-size="10" fill="#94a3b8">同时只开一个</text>
  <text class="t" x="78" y="544" font-size="10" fill="#fbbf24">⚠ name 不提交表单</text>
  <!-- 平滑动画 -->
  <rect x="330" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="344" y="462" font-size="12" font-weight="bold" fill="#a78bfa">::details-content 动画</text>
  <text class="m" x="344" y="484" font-size="10" fill="#cbd5e1">::details-content {</text>
  <text class="m" x="344" y="500" font-size="10" fill="#cbd5e1">  transition: height .3s;</text>
  <text class="m" x="344" y="516" font-size="10" fill="#cbd5e1">}</text>
  <text class="t" x="344" y="540" font-size="10" fill="#94a3b8">高度 + 透明度平滑过渡</text>
  <text class="t" x="344" y="558" font-size="10" fill="#94a3b8">替代 JS 手写动画</text>
  <!-- 自定义标记 -->
  <rect x="586" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text class="t" x="600" y="462" font-size="12" font-weight="bold" fill="#fbbf24">自定义 summary 标记</text>
  <text class="m" x="600" y="484" font-size="10" fill="#cbd5e1">summary { list-style: none }</text>
  <text class="m" x="600" y="500" font-size="10" fill="#cbd5e1">summary::after { content: '+' }</text>
  <text class="t" x="600" y="524" font-size="10" fill="#94a3b8">隐藏默认三角</text>
  <text class="t" x="600" y="542" font-size="10" fill="#94a3b8">自定义 +/- 或箭头</text>
  <!-- 与 VT 配合 -->
  <rect x="842" y="440" width="302" height="160" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="856" y="462" font-size="12" font-weight="bold" fill="#f472b6">与 View Transitions 配合</text>
  <text class="m" x="856" y="484" font-size="10" fill="#cbd5e1">toggle 事件 + startViewTransition</text>
  <text class="t" x="856" y="508" font-size="10" fill="#94a3b8">展开/收起快照补间</text>
  <text class="t" x="856" y="526" font-size="10" fill="#94a3b8">更丝滑的视觉过渡</text>
  <text class="t" x="856" y="544" font-size="10" fill="#fbbf24">Chrome 131+ / Safari 18.4+</text>
  <text class="t" x="856" y="562" font-size="10" fill="#94a3b8">Firefox 136+ 渐进增强</text>
  <path d="M 552 428 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fbbf24"/>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">&lt;summary&gt; 必须是第一个子元素；open 属性控制默认展开，SSR 友好</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">相同 name 的 details 自动互斥；::details-content 实现 height 平滑过渡</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">interpolate-size: allow-keywords 是 height: auto 过渡的关键开关</text>
