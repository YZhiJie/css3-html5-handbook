  <text class="t pt" x="92" y="422">落地收束 · 高清三步与四类场景</text>

  <rect x="58" y="442" width="552" height="164" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="78" y="470" font-size="12" fill="#94a3b8">// 高清适配标准三步</text>
  <text class="m" x="78" y="496" font-size="12" fill="#22d3ee">const dpr = devicePixelRatio || 1;</text>
  <text class="m" x="78" y="522" font-size="12" fill="#22d3ee">canvas.width = cssW * dpr;   // 表面放大</text>
  <text class="m" x="78" y="548" font-size="12" fill="#22d3ee">canvas.style.width = cssW+'px'; // 显示不变</text>
  <text class="m" x="78" y="574" font-size="12" fill="#fbbf24">ctx.scale(dpr, dpr);  // 之后仍按 CSS 坐标画</text>
  <text class="t an" x="78" y="596" font-size="11.5">scale 在所有绘制前调一次；restore 会连它一起还原</text>

