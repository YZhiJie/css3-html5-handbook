  <text class="m" x="640" y="312" font-size="11" fill="#22d3ee">ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo();</text>
  <text class="t an" x="640" y="338">路径是指令队列：fill/stroke 才光栅化，新图形前必须 beginPath</text>
