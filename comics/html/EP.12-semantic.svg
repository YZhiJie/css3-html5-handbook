  <text class="t kb" x="266" y="708">div/span 是无语义通用容器；结构标签名即含义，SEO 与读屏器直接读出角色</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">语义标签 ≈ 免费 ARIA role 加键盘行为——能用原生就别用 ARIA 补救</text>
