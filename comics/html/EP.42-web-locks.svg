  <rect x="0" y="0" width="1200" height="840" fill="#0b1220"/>

  <!-- ===== 顶部横幅 ===== -->
  <rect x="40" y="6" width="120" height="6" rx="3" fill="#22d3ee"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#f472b6"/>
  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · HTML 篇</text>
  <text class="t bt" x="40" y="80">第 42 话 · Web Locks API — 跨标签页互斥锁</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.42</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 多标签同时写，数据互相覆盖</text>
  <rect x="64" y="176" width="248" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="78" y="198" font-size="12" font-weight="bold" fill="#f87171">标签 A 和标签 B</text>
  <text class="m" x="78" y="220" font-size="10" fill="#cbd5e1">// 标签 A：写草稿</text>
  <text class="m" x="78" y="238" font-size="10" fill="#cbd5e1">localStorage.set(draftA)</text>
  <text class="m" x="78" y="256" font-size="10" fill="#cbd5e1">// 标签 B：同时写</text>
  <text class="m" x="78" y="274" font-size="10" fill="#cbd5e1">localStorage.set(draftB)</text>
  <text class="t" x="78" y="296" font-size="10" fill="#f87171">后写入覆盖先写入</text>
  <text class="t" x="78" y="314" font-size="10" fill="#94a3b8">数据丢失，用户投诉</text>
  <rect x="326" y="176" width="246" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="340" y="198" font-size="12" font-weight="bold" fill="#94a3b8">叠加痛苦</text>
  <text class="t" x="340" y="220" font-size="10" fill="#f87171">· IndexedDB 异步竞态</text>
  <text class="t" x="340" y="238" font-size="10" fill="#f87171">· 轮询同步顺序乱</text>
  <text class="t" x="340" y="256" font-size="10" fill="#f87171">· Service Worker 也抢</text>
  <text class="t" x="340" y="278" font-size="10" fill="#94a3b8">自己实现锁太难</text>
  <text class="t" x="340" y="296" font-size="10" fill="#94a3b8">跨 tab 通信复杂</text>
  <text class="t" x="64" y="362" font-size="13" font-weight="bold" fill="#f87171">「同一个站点开三个标签，localStorage 被写成一锅粥！」</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">?</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 浏览器原生锁</text>
  <rect x="648" y="176" width="250" height="170" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="662" y="198" font-size="12" font-weight="bold" fill="#22d3ee">独占锁（写）</text>
  <text class="m" x="662" y="218" font-size="10" fill="#cbd5e1">navigator.locks.request(</text>
  <text class="m" x="662" y="234" font-size="10" fill="#cbd5e1">  'draft', async () =&gt; {</text>
  <text class="m" x="662" y="250" font-size="10" fill="#cbd5e1">  await save();</text>
  <text class="m" x="662" y="266" font-size="10" fill="#cbd5e1">})</text>
  <text class="t" x="662" y="290" font-size="10" fill="#94a3b8">同名锁同时只有一个</text>
  <text class="t" x="662" y="308" font-size="10" fill="#94a3b8">回调结束自动释放</text>
  <rect x="914" y="176" width="230" height="170" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="928" y="198" font-size="12" font-weight="bold" fill="#a78bfa">共享锁（读）</text>
  <text class="m" x="928" y="218" font-size="10" fill="#cbd5e1">mode: 'shared'</text>
  <text class="t" x="928" y="240" font-size="10" fill="#94a3b8">多标签并发读不阻塞</text>
  <text class="t" x="928" y="258" font-size="10" fill="#94a3b8">排斥独占写锁</text>
  <text class="t" x="928" y="278" font-size="10" fill="#94a3b8">ifAvailable 不排队</text>
  <text class="t" x="928" y="296" font-size="10" fill="#fbbf24">⚠ AbortSignal 可超时</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">「跨标签页/窗口/iframe 同源互斥——浏览器帮你排队」</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 四大实战场景</text>
  <!-- 单标签写草稿 -->
  <rect x="64" y="440" width="250" height="160" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#22d3ee">单标签写草稿</text>
  <text class="m" x="78" y="484" font-size="10" fill="#cbd5e1">locks.request('draft',</text>
  <text class="m" x="78" y="500" font-size="10" fill="#cbd5e1">  async () =&gt; { ... })</text>
  <text class="t" x="78" y="524" font-size="10" fill="#94a3b8">多标签排队写</text>
  <text class="t" x="78" y="542" font-size="10" fill="#94a3b8">后写读到先写结果</text>
  <!-- 读多写少 -->
  <rect x="330" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="344" y="462" font-size="12" font-weight="bold" fill="#a78bfa">读多写少缓存</text>
  <text class="m" x="344" y="484" font-size="10" fill="#cbd5e1">mode: 'shared'</text>
  <text class="t" x="344" y="508" font-size="10" fill="#94a3b8">多标签并发读</text>
  <text class="t" x="344" y="526" font-size="10" fill="#94a3b8">写时独占排斥</text>
  <text class="t" x="344" y="544" font-size="10" fill="#fbbf24">读写分离不互踩</text>
  <!-- 非阻塞轮询 -->
  <rect x="586" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text class="t" x="600" y="462" font-size="12" font-weight="bold" fill="#fbbf24">非阻塞轮询</text>
  <text class="m" x="600" y="484" font-size="10" fill="#cbd5e1">ifAvailable: true</text>
  <text class="t" x="600" y="508" font-size="10" fill="#94a3b8">能拿就拿</text>
  <text class="t" x="600" y="526" font-size="10" fill="#94a3b8">拿不到立即返回</text>
  <text class="t" x="600" y="544" font-size="10" fill="#fbbf24">适合轮询更新场景</text>
  <!-- 超时放弃 -->
  <rect x="842" y="440" width="302" height="160" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="856" y="462" font-size="12" font-weight="bold" fill="#f472b6">AbortSignal 超时</text>
  <text class="m" x="856" y="484" font-size="10" fill="#cbd5e1">signal: ac.signal</text>
  <text class="t" x="856" y="508" font-size="10" fill="#94a3b8">5 秒拿不到就放弃</text>
  <text class="t" x="856" y="526" font-size="10" fill="#94a3b8">防止无限排队卡死</text>
  <text class="t" x="856" y="544" font-size="10" fill="#fbbf24">Chrome 69+ / Safari 15.4+</text>
  <text class="t" x="856" y="562" font-size="10" fill="#94a3b8">Firefox 72+ 全绿</text>
  <path d="M 552 428 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fbbf24"/>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">独占锁同时只一个持有者；共享锁并发读、排斥写——读多写少用 shared</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">回调结束锁自动释放；页面崩溃浏览器也保证最终一致性</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">不要嵌套取同名锁；锁名要语义化（"user:123:draft"）避免无意义排队</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.42 · 锁</text>

  <text class="t ft" x="40" y="822">霓虹墨 Neon Ink · 第 42 话 — 深入阅读 docs/html/15-web-locks.md · 示例 examples/html/15-web-locks</text>
</svg>
