  <text class="m" x="450" y="556" font-size="10.5" fill="#cbd5e1">granted 静默 · denied 引导</text>
  <text class="t an" x="450" y="582" font-size="11">accuracy &gt; 阈值判不可信</text>
  <text class="t an" x="450" y="600" font-size="11">页面隐藏/卸载必须 clearWatch 省电</text>

