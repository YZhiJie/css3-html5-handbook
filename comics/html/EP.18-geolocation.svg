  <text class="t an" x="368" y="228" font-size="11">一进页面就弹</text>
  <text class="t an" x="368" y="248" font-size="11">用户反射性点"阻止"</text>

  <text class="t" x="64" y="294" font-size="14" font-weight="bold" fill="#f87171">非 https/localhost 直接没 API，弹窗又来得太早</text>
  <text class="t an" x="64" y="320">位置是敏感隐私：浏览器有独立权限流程</text>
  <text class="t an" x="64" y="342">拒绝后不再弹窗，只能引导用户去站点设置恢复</text>
