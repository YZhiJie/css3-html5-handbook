  <text class="m" x="650" y="288" font-size="10.5" fill="#67e8f9">lat 31.23 lng 121.47</text>
  <text class="m" x="650" y="306" font-size="10.5" fill="#67e8f9">accuracy 65m</text>

  <rect x="770" y="176" width="170" height="104" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="t" x="786" y="200" font-size="12" font-weight="bold" fill="#c4b5fd">PositionOptions</text>
  <text class="m" x="786" y="222" font-size="10" fill="#cbd5e1">enableHighAccuracy</text>
  <text class="m" x="786" y="242" font-size="10" fill="#cbd5e1">timeout: 10000</text>
  <text class="m" x="786" y="262" font-size="10" fill="#cbd5e1">maximumAge: 30000</text>

  <rect x="956" y="176" width="184" height="104" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text class="t" x="972" y="200" font-size="12" font-weight="bold" fill="#fca5a5">onError 只认 code</text>
  <text class="m" x="972" y="222" font-size="10" fill="#cbd5e1">1 PERMISSION_DENIED</text>
  <text class="m" x="972" y="242" font-size="10" fill="#cbd5e1">2 POSITION_UNAVAILABLE</text>
  <text class="m" x="972" y="262" font-size="10" fill="#cbd5e1">3 TIMEOUT</text>

  <text class="m" x="640" y="312" font-size="11" fill="#22d3ee">getCurrentPosition(ok, err, opts)  // 单次</text>
  <text class="m" x="640" y="338" font-size="11" fill="#fbbf24">watchPosition() 持续回调 → clearWatch(id) 必取消</text>
