  <text class="t" x="64" y="306" font-size="14" font-weight="bold" fill="#f87171">一个图标切 16/32/48 三套，改主题色还得重出图</text>
  <text class="t an" x="64" y="332">雪碧图和字体图标各有包袱：缩放、上色、点击都受限</text>
  <text class="t an" x="64" y="352">图标既要无损缩放，又要能 hover 能点击——该 SVG 了</text>
