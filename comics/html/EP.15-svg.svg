  <text class="m" x="752" y="284" text-anchor="middle" font-size="10" fill="#67e8f9">viewBox 0 0 100 50 → ×2.24</text>

  <rect x="884" y="172" width="216" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="900" y="198" font-size="12.5" font-weight="bold" fill="#c4b5fd">保留模式 Retained</text>
  <text class="t an" x="900" y="222" font-size="11.5">• 图形就是 DOM 节点</text>
  <text class="t an" x="900" y="242" font-size="11.5">• 改属性浏览器自动重绘</text>
  <text class="t an" x="900" y="262" font-size="11.5">• 每个图形可绑事件、CSS 上色</text>
  <text class="t an" x="900" y="282" font-size="11.5">• currentColor 跟随文字色</text>

  <text class="t an" x="640" y="320">viewBox 建逻辑坐标系，等比映射到任意视口——一份定义无损缩放</text>
  <text class="m" x="640" y="344" font-size="11" fill="#22d3ee">&lt;svg viewBox="0 0 100 50"&gt; 16px 到 1600px 都清晰</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

