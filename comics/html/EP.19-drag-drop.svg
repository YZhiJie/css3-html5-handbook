  <text class="m" x="822" y="214" text-anchor="middle" font-size="11" fill="#94a3b8">drag×N</text>
  <rect x="886" y="194" width="100" height="30" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="m" x="936" y="214" text-anchor="middle" font-size="11" fill="#67e8f9">dragend</text>

  <text class="t" x="640" y="258" font-size="12" font-weight="bold" fill="#f9a8d4">投放目标（目）</text>
  <rect x="640" y="268" width="106" height="30" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text class="m" x="693" y="288" text-anchor="middle" font-size="11" fill="#f9a8d4">dragenter</text>
  <rect x="760" y="268" width="106" height="30" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text class="m" x="813" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#fecaca">dragover</text>
  <rect x="880" y="268" width="90" height="30" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text class="m" x="925" y="288" text-anchor="middle" font-size="11" fill="#f9a8d4">drop</text>
  <rect x="984" y="268" width="106" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="m" x="1037" y="288" text-anchor="middle" font-size="11" fill="#94a3b8">dragleave</text>

  <rect x="1000" y="188" width="142" height="64" rx="8" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="m" x="1012" y="210" font-size="10" fill="#fbbf24">dragover 必须</text>
  <text class="m" x="1012" y="228" font-size="10" fill="#fbbf24">e.preventDefault()</text>
  <text class="t an" x="1012" y="246" font-size="10">否则 drop 永不触发</text>

  <text class="t an" x="640" y="322">①dragover preventDefault 放行 ②drop 也拦默认（防打开链接）</text>
  <text class="t an" x="640" y="344">③数据 dragstart 写、drop 读，中途只能看 types 列表</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
