  <text class="m" x="82" y="224" font-size="10.5" fill="#fca5a5">自己算坐标/边界/命中</text>
  <text class="m" x="82" y="244" font-size="10.5" fill="#fca5a5">自己做幽灵元素快照</text>
  <text class="t an" x="82" y="266" font-size="11">状态机写满一屏，触摸端还得重来</text>

  <rect x="306" y="178" width="208" height="96" rx="10" fill="#0b1220" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="328" y="196" width="56" height="60" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="384,210 402,200 402,220" fill="#fbbf24"/>
  <line x1="402" y1="226" x2="402" y2="246" stroke="#f87171" stroke-width="2.5"/>
  <line x1="396" y1="240" x2="402" y2="246" stroke="#f87171" stroke-width="2.5"/>
  <line x1="408" y1="240" x2="402" y2="246" stroke="#f87171" stroke-width="2.5"/>
  <text class="t an" x="328" y="270" font-size="11">桌面文件想拖进网页？</text>

  <text class="t" x="64" y="306" font-size="14" font-weight="bold" fill="#f87171">看板流转、列表排序是中后台高频交互</text>
  <text class="t an" x="64" y="332">浏览器本就能做：影像、命中判定、系统级数据通道</text>
  <text class="t an" x="64" y="352">只差声明：谁能拖、谁能收、收下干什么</text>
