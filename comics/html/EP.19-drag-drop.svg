  <text class="t" x="126" y="564" text-anchor="middle" font-size="10.5" fill="#cbd5e1">卡片 B</text>
  <text class="m" x="190" y="496" font-size="10" fill="#22d3ee">dragover 里算几何中心</text>
  <text class="m" x="190" y="516" font-size="10" fill="#cbd5e1">getBoundingClientRect()</text>
  <text class="m" x="190" y="536" font-size="10" fill="#fbbf24">insertBefore(el, after)</text>
  <text class="t an" x="190" y="562" font-size="11">跨容器：目标是最上层放行元素</text>
  <text class="t an" x="190" y="584" font-size="11">drop 委托在容器上，防落子元素</text>

  <rect x="430" y="442" width="330" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="450" y="468" font-size="13" font-weight="bold" fill="#f9a8d4">桌面文件直接拖入</text>
  <rect x="450" y="484" width="120" height="58" rx="8" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t" x="510" y="510" text-anchor="middle" font-size="11.5" fill="#fbbf24">drop zone</text>
  <text class="t" x="510" y="530" text-anchor="middle" font-size="10" fill="#94a3b8">松手在此</text>
  <text class="m" x="586" y="498" font-size="10.5" fill="#67e8f9">e.dataTransfer.files</text>
  <text class="m" x="586" y="518" font-size="10.5" fill="#cbd5e1">FileReader</text>
  <text class="m" x="586" y="538" font-size="10.5" fill="#cbd5e1">readAsDataURL</text>
  <text class="t an" x="450" y="568" font-size="11">types 含 'Files' 即可判定文件拖入</text>
  <text class="t an" x="450" y="590" font-size="11">setDragImage 可换自定义拖拽影像</text>

  <rect x="776" y="442" width="364" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="796" y="468" font-size="13" font-weight="bold" fill="#fcd34d">移动端：Pointer Events 替代</text>
  <text class="m" x="796" y="496" font-size="10.5" fill="#cbd5e1">pointerdown → setPointerCapture</text>
  <text class="m" x="796" y="516" font-size="10.5" fill="#cbd5e1">pointermove 跟幽灵元素</text>
  <text class="m" x="796" y="536" font-size="10.5" fill="#cbd5e1">elementFromPoint() 找投放区</text>
  <text class="m" x="796" y="556" font-size="10.5" fill="#fbbf24">pointerup → 同一个业务函数</text>
  <text class="t an" x="796" y="584" font-size="11">原生 DnD 安卓全线不支持；落点业务抽函数复用</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">draggable=true 才是源；dragover 不 preventDefault，drop 永远不触发——DnD 第一大坑</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">dataTransfer 是一次性信封：dragstart 写、drop 读，中途只许看 types；files 走系统级通道</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">排序在 dragover 里算中心点 insertBefore；移动端不支持原生 DnD，用 Pointer Events 复用同一业务</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.19 · Drag&amp;Drop</text>

  <text class="t ft" x="40" y="822">霓虹墨 Neon Ink · 第 19 话 — 深入阅读 docs/html/08-drag-drop.md · 示例 examples/html/08-drag-drop</text>
