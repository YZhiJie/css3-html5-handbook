  <text class="t an" x="652" y="248" font-size="11">焦点陷阱 + 自动归还</text>
  <text class="t an" x="652" y="268" font-size="11">ESC / ::backdrop</text>
  <text class="t an" x="652" y="288" font-size="11">method=dialog 返值</text>
  <text class="t an" x="652" y="308" font-size="11">show() 非模态做侧栏</text>

