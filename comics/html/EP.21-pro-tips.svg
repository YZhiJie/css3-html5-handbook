  <text class="t an" x="830" y="248" font-size="11">light dismiss 点外/ESC</text>
  <text class="t an" x="830" y="268" font-size="11">:popover-open 动画</text>
  <text class="t an" x="830" y="288" font-size="11">auto 单组互斥</text>
  <text class="t an" x="830" y="308" font-size="11">manual 给 Toast 堆叠</text>

