  <rect x="58" y="442" width="360" height="164" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="t" x="78" y="468" font-size="13" font-weight="bold" fill="#67e8f9">template 安全渲染列表</text>
  <text class="m" x="78" y="494" font-size="10.5" fill="#94a3b8">&lt;template&gt; 惰性不解析不加载</text>
  <text class="m" x="78" y="516" font-size="10.5" fill="#22d3ee">tpl.content.cloneNode(true)</text>
  <text class="m" x="78" y="538" font-size="10.5" fill="#22d3ee">el.textContent = userInput</text>
  <text class="t an" x="78" y="566" font-size="11">文本永远是文本，不被解析成标签</text>
  <text class="t an" x="78" y="588" font-size="11">data-* + 事件委托绑定行为</text>

