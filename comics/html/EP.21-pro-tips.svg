  <rect x="560" y="484" width="96" height="26" rx="13" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2"/><text class="t" x="608" y="502" text-anchor="middle" font-size="10.5" fill="#67e8f9">preconnect</text>
