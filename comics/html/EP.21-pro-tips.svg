  <rect x="544" y="518" width="112" height="26" rx="13" fill="#0b1220" stroke="#fbbf24" stroke-width="1.2"/><text class="t" x="600" y="536" text-anchor="middle" font-size="10.5" fill="#fcd34d">modulepreload</text>
