  <rect x="0" y="0" width="1200" height="840" fill="#0b1220"/>

  <!-- ===== 顶部横幅 ===== -->
  <rect x="40" y="6" width="120" height="6" rx="3" fill="#fbbf24"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#fb923c"/>
  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · HTML 篇</text>
  <text class="t bt" x="40" y="80">第 20 话 · 多媒体 — 无需插件的播放管线</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#fbbf24"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.20</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 有声自动播放被拦</text>

  <rect x="64" y="182" width="224" height="78" rx="10" fill="#0b1220" stroke="#f87171" stroke-width="2"/>
  <polygon points="90,204 90,238 118,221" fill="#f87171"/>
  <text class="m" x="134" y="214" font-size="11" fill="#fca5a5">video.play()</text>
  <text class="m" x="134" y="236" font-size="11" fill="#fca5a5">→ Promise reject</text>
  <text class="m" x="134" y="254" font-size="10" fill="#f87171">NotAllowedError 未捕获</text>

  <rect x="312" y="182" width="202" height="78" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="338,204 338,238 366,221" fill="#22d3ee"/>
  <text class="m" x="382" y="214" font-size="10.5" fill="#67e8f9">autoplay muted</text>
  <text class="m" x="382" y="234" font-size="10.5" fill="#67e8f9">playsinline</text>
  <text class="t an" x="338" y="254" font-size="10.5">静音内联，全绿姿势</text>

  <text class="t" x="64" y="294" font-size="14" font-weight="bold" fill="#f87171">浏览器禁止"没打招呼就出声"</text>
  <text class="t an" x="64" y="320">有声自动播放靠媒体参与度历史，不可依赖</text>
  <text class="t an" x="64" y="342">play() 的 Promise 必须 catch，降级静音重试</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <circle cx="556" cy="272" r="12" fill="#f87171"/>
  <text class="t" x="556" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">!</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · source 选择与事件流</text>

  <rect x="636" y="176" width="248" height="132" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="654" y="200" font-size="10.5" fill="#94a3b8">&lt;video controls poster playsinline&gt;</text>
  <text class="m" x="654" y="222" font-size="10.5" fill="#fbbf24">&lt;source type="video/webm"&gt; 1</text>
  <text class="m" x="654" y="244" font-size="10.5" fill="#22d3ee">&lt;source type="video/mp4"&gt; 2</text>
  <text class="m" x="654" y="266" font-size="10.5" fill="#cbd5e1">&lt;track kind="subtitles" vtt&gt;</text>
  <text class="t an" x="654" y="292" font-size="10.5">按顺序命中第一个"支持"的即停</text>

  <rect x="900" y="176" width="240" height="132" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="918" y="200" font-size="12" font-weight="bold" fill="#c4b5fd">媒体事件流</text>
  <text class="m" x="918" y="222" font-size="10" fill="#67e8f9">loadedmetadata → 时长到手</text>
  <text class="m" x="918" y="242" font-size="10" fill="#67e8f9">canplay → 可起播</text>
  <text class="m" x="918" y="262" font-size="10" fill="#fbbf24">timeupdate ×250ms → 进度条</text>
  <text class="m" x="918" y="282" font-size="10" fill="#f9a8d4">waiting/playing → 缓冲菊花</text>
  <text class="m" x="918" y="302" font-size="10" fill="#f87171">error 在出错的 source 上触发</text>
  <text class="t an" x="636" y="336">type 写对才能不下载就判断；error 监听要挂在 source 元素；track 需 VTT</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 自定义控件、响应式图片与频谱可视化</text>

  <rect x="58" y="442" width="340" height="164" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <rect x="78" y="462" width="300" height="62" rx="8" fill="#1e293b"/>
  <rect x="92" y="480" width="26" height="26" rx="5" fill="#22d3ee"/><polygon points="102,488 102,498 111,493" fill="#0b1220"/>
  <rect x="132" y="491" width="160" height="5" rx="2.5" fill="#334155"/>
  <rect x="132" y="491" width="84" height="5" rx="2.5" fill="#22d3ee"/>
  <circle cx="216" cy="493.5" r="5" fill="#f8fafc"/>
  <text class="m" x="304" y="498" font-size="9.5" fill="#94a3b8">1.5×</text>
  <text class="m" x="78" y="552" font-size="10.5" fill="#22d3ee">currentTime=30 进度 seek</text>
  <text class="m" x="78" y="572" font-size="10.5" fill="#22d3ee">playbackRate=1.5 倍速</text>
  <text class="t an" x="78" y="594" font-size="11">iOS 音量跟随系统；requestPictureInPicture 先检测</text>

  <rect x="414" y="442" width="340" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="434" y="468" font-size="13" font-weight="bold" fill="#f9a8d4">picture 响应式决策器</text>
  <rect x="434" y="484" width="92" height="60" rx="6" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="448" y="498" width="64" height="34" rx="3" fill="#334155"/><rect x="448" y="498" width="30" height="34" rx="3" fill="#a78bfa" opacity="0.55"/>
  <text class="m" x="538" y="500" font-size="10" fill="#c4b5fd">media 视口裁切</text>
  <text class="m" x="538" y="520" font-size="10" fill="#c4b5fd">type avif/webp/jpg</text>
  <text class="m" x="538" y="540" font-size="10" fill="#67e8f9">srcset 400w 800w 1600w</text>
  <text class="t an" x="434" y="570" font-size="11">布局时一次性选源，必留 img 回退</text>
  <text class="t an" x="434" y="592" font-size="11">sizes 告知显示宽度，DPR×布局宽二维决策</text>

  <rect x="770" y="442" width="370" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="790" y="468" font-size="13" font-weight="bold" fill="#fcd34d">Web Audio 桥接做频谱</text>
  <rect x="792" y="500" width="8" height="26" fill="#22d3ee"/><rect x="804" y="488" width="8" height="38" fill="#22d3ee"/><rect x="816" y="508" width="8" height="18" fill="#f472b6"/><rect x="828" y="480" width="8" height="46" fill="#fbbf24"/><rect x="840" y="496" width="8" height="30" fill="#a78bfa"/><rect x="852" y="510" width="8" height="16" fill="#22d3ee"/><rect x="864" y="486" width="8" height="40" fill="#f472b6"/><rect x="876" y="502" width="8" height="24" fill="#fbbf24"/>
  <text class="m" x="898" y="500" font-size="10" fill="#cbd5e1">createMediaElementSource</text>
  <text class="m" x="898" y="520" font-size="10" fill="#cbd5e1">→ AnalyserNode</text>
  <text class="m" x="898" y="540" font-size="10" fill="#f87171">→ connect(destination)</text>
  <text class="t an" x="790" y="572" font-size="11">不接 destination 会无声；AudioContext 需手势 resume</text>
  <text class="t an" x="790" y="594" font-size="11">跨域视频画 canvas 要 crossorigin，否则画布被污染</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">有声自动播放被策略拦：muted playsinline 才全绿，play() 返回的 Promise 必须 catch 降级</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">source 按顺序命中第一个支持的即停、type 必写、MP4/H.264 兜底；error 事件在 source 上</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">picture 用 media/type/srcset+sizes 做决策且必留 img；timeupdate 驱动进度，Web Audio 末端接 destination</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.20 · Media</text>

  <text class="t ft" x="40" y="822">霓虹墨 Neon Ink · 第 20 话 — 深入阅读 docs/html/09-multimedia.md · 示例 examples/html/09-multimedia</text>
