  <text class="t an" x="70" y="556">type 决定控件、键盘与校验；验证码框再补 inputmode="numeric"</text>
  <text class="m" x="70" y="582" font-size="11" fill="#22d3ee">&lt;input type="email" required /&gt; 自动唤起带 @ 的键盘</text>

  <rect x="424" y="442" width="716" height="108" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="440" y="468" font-size="11" fill="#94a3b8">// novalidate：跳过提交自动拦截，checkValidity 照常用</text>
  <text class="m" x="440" y="492" font-size="11.5" fill="#cbd5e1">if (pwd.value !== pwd2.value) {</text>
  <text class="m" x="440" y="514" font-size="11.5" fill="#fbbf24">  pwd2.setCustomValidity('两次密码不一致');  // 置为非法</text>
  <text class="m" x="440" y="536" font-size="11.5" fill="#cbd5e1">} else { pwd2.setCustomValidity(''); } // 修好后必须清空！</text>

