  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">type 不只是控件名：移动端键盘、原生校验、自动填充三件事都由它决定</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">规则声明给浏览器：required/pattern/min/max 提交自动拦截，JS 只管业务规则</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">novalidate 只接管提交时机；setCustomValidity 修复后必须传空串复位</text>
