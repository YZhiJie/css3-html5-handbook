  <rect x="64" y="170" width="410" height="92" rx="10" fill="#0b1220" stroke="#f87171" stroke-width="2"/>
  <text class="m" x="82" y="196" font-size="12" fill="#fca5a5">if (!/^\S+@\S+\.\S+$/.test(email)) {</text>
  <text class="m" x="82" y="220" font-size="12" fill="#fca5a5">  showError('邮箱格式不正确');</text>
  <text class="m" x="82" y="244" font-size="12" fill="#fca5a5">}  // 手机号、URL、年龄范围再来三套…</text>

