  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · HTML 篇</text>
  <text class="t bt" x="40" y="80">第 46 话 · Service Worker 缓存策略</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#f472b6"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.46</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#f472b6"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 弱网环境打不开</text>
  <rect x="64" y="176" width="248" height="170" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="78" y="198" font-size="12" font-weight="bold" fill="#f87171">用户抱怨</text>
  <text class="m" x="78" y="220" font-size="10" fill="#cbd5e1">地铁上打不开页面</text>
  <text class="m" x="78" y="238" font-size="10" fill="#cbd5e1">电梯里白屏 30 秒</text>
  <text class="m" x="78" y="256" font-size="10" fill="#cbd5e1">二次访问还慢</text>
  <text class="t" x="78" y="278" font-size="10" fill="#f87171">HTTP 缓存不可控</text>
  <text class="t" x="78" y="296" font-size="10" fill="#94a3b8">离线 = 完全不可用</text>
  <text class="t" x="78" y="314" font-size="10" fill="#94a3b8">用户流失严重</text>
  <rect x="326" y="176" width="246" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="340" y="198" font-size="12" font-weight="bold" fill="#94a3b8">叠加痛苦</text>
  <text class="t" x="340" y="220" font-size="10" fill="#f87171">· Cache-Control 太粗</text>
  <text class="t" x="340" y="238" font-size="10" fill="#f87171">· 无法按 URL 定制策略</text>
  <text class="t" x="340" y="256" font-size="10" fill="#f87171">· 离线体验为零</text>
  <text class="t" x="340" y="278" font-size="10" fill="#94a3b8">竞争对手秒开</text>
  <text class="t" x="340" y="296" font-size="10" fill="#94a3b8">用户流失 30%</text>
  <text class="t" x="64" y="362" font-size="13" font-weight="bold" fill="#f87171">「地铁上打不开，用户说我们是石器时代的网站！」</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <text class="t" x="552" y="284" font-size="20" font-weight="bold" fill="#f87171">?</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 三大缓存策略</text>
  <rect x="648" y="176" width="250" height="170" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="662" y="198" font-size="12" font-weight="bold" fill="#22d3ee">Cache First</text>
  <text class="m" x="662" y="218" font-size="10" fill="#cbd5e1">caches.match(req)</text>
  <text class="m" x="662" y="234" font-size="10" fill="#cbd5e1">  .then(cached =&gt;</text>
  <text class="m" x="662" y="250" font-size="10" fill="#cbd5e1">    cached || fetch(req))</text>
  <text class="t" x="662" y="274" font-size="10" fill="#94a3b8">有缓存用缓存</text>
  <text class="t" x="662" y="292" font-size="10" fill="#94a3b8">适用静态资源</text>
  <rect x="914" y="176" width="230" height="170" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="928" y="198" font-size="12" font-weight="bold" fill="#a78bfa">Network First</text>
  <text class="m" x="928" y="218" font-size="10" fill="#cbd5e1">fetch(req)</text>
  <text class="m" x="928" y="234" font-size="10" fill="#cbd5e1">  .catch(() =&gt;</text>
  <text class="m" x="928" y="250" font-size="10" fill="#cbd5e1">    caches.match(req))</text>
  <text class="t" x="928" y="274" font-size="10" fill="#94a3b8">先走网络</text>
  <text class="t" x="928" y="292" font-size="10" fill="#fbbf24">⚠ 失败用缓存兜底</text>
  <text class="t" x="648" y="344" font-size="13" font-weight="bold" fill="#a78bfa">「Stale While Revalidate：先返回缓存，后台更新——秒开+新鲜」</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · 四大实战场景</text>
  <!-- 静态资源 -->
  <rect x="64" y="440" width="250" height="160" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="78" y="462" font-size="12" font-weight="bold" fill="#22d3ee">静态资源 Cache First</text>
  <text class="m" x="78" y="484" font-size="10" fill="#cbd5e1">CSS/JS/图片</text>
  <text class="t" x="78" y="508" font-size="10" fill="#94a3b8">二次访问秒开</text>
  <text class="t" x="78" y="526" font-size="10" fill="#94a3b8">服务器流量降 60%</text>
  <text class="t" x="78" y="544" font-size="10" fill="#fbbf24">⚠ 版本号管理缓存</text>
  <!-- API 数据 -->
  <rect x="330" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text class="t" x="344" y="462" font-size="12" font-weight="bold" fill="#a78bfa">API Network First</text>
  <text class="m" x="344" y="484" font-size="10" fill="#cbd5e1">/api/products</text>
  <text class="t" x="344" y="508" font-size="10" fill="#94a3b8">实时性优先</text>
  <text class="t" x="344" y="526" font-size="10" fill="#94a3b8">失败返回缓存</text>
  <text class="t" x="344" y="544" font-size="10" fill="#fbbf24">⚠ POST 不可缓存</text>
  <!-- 列表数据 -->
  <rect x="586" y="440" width="240" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text class="t" x="600" y="462" font-size="12" font-weight="bold" fill="#fbbf24">列表 SWR</text>
  <text class="m" x="600" y="484" font-size="10" fill="#cbd5e1">新闻/商品列表</text>
  <text class="t" x="600" y="508" font-size="10" fill="#94a3b8">秒开+后台更新</text>
  <text class="t" x="600" y="526" font-size="10" fill="#94a3b8">下次拿到新数据</text>
  <text class="t" x="600" y="544" font-size="10" fill="#94a3b8">用户体验最佳</text>
  <!-- 离线可用 -->
  <rect x="842" y="440" width="302" height="160" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="856" y="462" font-size="12" font-weight="bold" fill="#f472b6">离线可用 PWA</text>
  <text class="m" x="856" y="484" font-size="10" fill="#cbd5e1">install 预缓存</text>
  <text class="t" x="856" y="508" font-size="10" fill="#94a3b8">地铁/电梯也能开</text>
  <text class="t" x="856" y="526" font-size="10" fill="#94a3b8">用户留存提升</text>
  <text class="t" x="856" y="544" font-size="10" fill="#fbbf24">Chrome 40+ / Safari 11.1+</text>
  <text class="t" x="856" y="562" font-size="10" fill="#94a3b8">Firefox 44+ 全绿</text>
  <path d="M 552 428 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" fill="#fbbf24"/>

