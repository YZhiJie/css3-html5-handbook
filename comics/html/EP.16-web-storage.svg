  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · HTML 篇</text>
  <text class="t bt" x="40" y="80">第 16 话 · Web Storage — 刷新不丢的键值仓库</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#fbbf24"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.16</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 什么都往 Cookie 塞</text>

  <rect x="64" y="178" width="196" height="76" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text class="t" x="80" y="204" font-size="12.5" font-weight="bold" fill="#fca5a5">Cookie 三宗罪</text>
  <text class="t an" x="80" y="226" font-size="11.5">• 每个 HTTP 请求自动携带</text>
  <text class="t an" x="80" y="246" font-size="11.5">• 单条 4KB · 字符串拼接解析</text>

  <rect x="284" y="178" width="230" height="76" rx="10" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
  <text class="m" x="300" y="204" font-size="10" fill="#94a3b8">GET /logo.png HTTP/1.1</text>
  <text class="m" x="300" y="222" font-size="10" fill="#fca5a5">Cookie: theme=dark; col=</text>
  <text class="m" x="300" y="240" font-size="10" fill="#fca5a5">{...} ...; 图片也带上</text>

  <text class="t" x="64" y="290" font-size="14" font-weight="bold" fill="#f87171">想存表格列配置，4KB 根本不够</text>
  <text class="t an" x="64" y="316">document.cookie 只是个字符串：读要解析、写要拼过期</text>
  <text class="t an" x="64" y="340">纯前端状态不该随请求白白发出去——分工该变了</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <circle cx="556" cy="272" r="12" fill="#f87171"/>
  <text class="t" x="556" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">!</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 两个仓库与 storage 广播</text>

  <rect x="636" y="176" width="240" height="84" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <rect x="660" y="196" width="42" height="44" rx="6" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="669" y="186" width="24" height="12" rx="3" fill="#22d3ee"/>
  <text class="t" x="716" y="210" font-size="13" font-weight="bold" fill="#67e8f9">localStorage</text>
  <text class="t an" x="716" y="232" font-size="11">持久化 · 重启浏览器还在 · 5~10MB</text>
  <text class="t an" x="660" y="252" font-size="10.5" fill="#94a3b8">主题、语言、长期缓存</text>

  <rect x="892" y="176" width="240" height="84" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <rect x="916" y="196" width="42" height="44" rx="6" fill="#0b1220" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="937" y1="196" x2="937" y2="240" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="t" x="972" y="210" font-size="13" font-weight="bold" fill="#c4b5fd">sessionStorage</text>
  <text class="t an" x="972" y="232" font-size="11">会话级 · 关标签页即销毁</text>
  <text class="t an" x="916" y="252" font-size="10.5" fill="#94a3b8">表单草稿、多步向导状态</text>

  <rect x="636" y="272" width="496" height="82" rx="10" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
  <rect x="656" y="294" width="110" height="36" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="t" x="711" y="317" text-anchor="middle" font-size="11.5" fill="#fbbf24">标签页 A 写入</text>
  <line x1="772" y1="312" x2="852" y2="312" stroke="#f472b6" stroke-width="2"/>
  <polygon points="852,307 860,312 852,317" fill="#f472b6"/>
  <rect x="862" y="294" width="110" height="36" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5"/>
  <text class="t" x="917" y="317" text-anchor="middle" font-size="11.5" fill="#f9a8d4">标签页 B 收到</text>
  <text class="t an" x="988" y="306" font-size="11">storage 事件广播</text>
  <text class="t an" x="988" y="326" font-size="11">同源其他页才触发</text>
  <text class="t an" x="988" y="344" font-size="11">写入页自己收不到</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · JSON 序列化与生产级封装</text>

  <rect x="58" y="442" width="396" height="164" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="78" y="468" font-size="11" fill="#f87171">setItem('u', {name:'明'})  // 坑！</text>
  <text class="m" x="78" y="490" font-size="11" fill="#fca5a5">getItem → "[object Object]"</text>
  <line x1="78" y1="502" x2="434" y2="502" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="m" x="78" y="524" font-size="11" fill="#22d3ee">setItem('u', JSON.stringify(user))</text>
  <text class="m" x="78" y="546" font-size="11" fill="#22d3ee">JSON.parse(getItem('u'))  // 成对</text>
  <text class="t an" x="78" y="572" font-size="11">undefined 序列化消失 · 循环引用抛错</text>
  <text class="t an" x="78" y="592" font-size="11">读不到返回 null，脏数据 try/catch 兜底</text>

  <rect x="470" y="442" width="396" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="490" y="468" font-size="13" font-weight="bold" fill="#fbbf24">SafeStorage 封装四件事</text>
  <text class="m" x="490" y="494" font-size="11" fill="#cbd5e1">new SafeStorage('myapp')</text>
  <text class="t an" x="490" y="518" font-size="11.5">① 命名空间前缀 app:key 防冲突</text>
  <text class="t an" x="490" y="540" font-size="11.5">② {v, e} 包一层实现 TTL 过期</text>
  <text class="t an" x="490" y="562" font-size="11.5">③ 探针检测，隐私模式降级内存 Map</text>
  <text class="t an" x="490" y="584" font-size="11.5">④ setItem 全 try/catch，配额满不中断</text>

  <rect x="882" y="442" width="258" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="902" y="468" font-size="13" font-weight="bold" fill="#f8fafc">典型用途</text>
  <circle cx="908" cy="492" r="3.5" fill="#22d3ee"/><text class="t an" x="920" y="496" font-size="11.5">深色主题 / 语言偏好</text>
  <circle cx="908" cy="518" r="3.5" fill="#f472b6"/><text class="t an" x="920" y="522" font-size="11.5">购物车徽标跨标签页同步</text>
  <circle cx="908" cy="544" r="3.5" fill="#a78bfa"/><text class="t an" x="920" y="548" font-size="11.5">字典接口缓存 + TTL</text>
  <circle cx="908" cy="570" r="3.5" fill="#fbbf24"/><text class="t an" x="920" y="574" font-size="11.5">长表单草稿防刷新丢失</text>
  <text class="m" x="902" y="596" font-size="10" fill="#f87171">敏感凭证不入 Storage（XSS 全可读）</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">local 持久、session 随标签页，同源隔离不随请求发送；只存字符串，对象必须 stringify/parse 成对</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">storage 事件只广播给同源其他标签页；配额满与隐私模式会抛错，setItem 一律 try/catch + 内存降级</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">key 加命名空间、TTL 自己实现、clear() 是核弹别乱按；敏感凭证交给 HttpOnly Cookie</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.16 · Storage</text>

  <text class="t ft" x="40" y="822">霓虹墨 Neon Ink · 第 16 话 — 深入阅读 docs/html/05-web-storage.md · 示例 examples/html/05-web-storage</text>
