  <rect x="0" y="0" width="1200" height="840" fill="#0b1220"/>

  <!-- ===== 顶部横幅 ===== -->
  <rect x="40" y="6" width="120" height="6" rx="3" fill="#fbbf24"/>
  <rect x="40" y="16" width="120" height="6" rx="3" fill="#fb923c"/>
  <text class="t st" x="40" y="40">前端漫画实验室 · CSS3 × HTML5 漫画剧场 · HTML 篇</text>
  <text class="t bt" x="40" y="80">第 17 话 · Web Workers — 后台线程解冻页面</text>
  <rect x="1020" y="26" width="140" height="44" rx="22" fill="#fbbf24"/>
  <text class="m" x="1090" y="54" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b1220">EP.17</text>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#1e293b" stroke-width="2"/>

  <!-- ===== 格1 · 痛点现场 ===== -->
  <rect x="40" y="120" width="556" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="120" width="556" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="146" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">1</text>
  <text class="t pt" x="92" y="152">痛点现场 · 一个长任务全卡死</text>

  <rect x="64" y="184" width="36" height="36" rx="4" fill="#22d3ee"/>
  <line x1="100" y1="214" x2="100" y2="170" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="t" x="110" y="192" font-size="12" font-weight="bold" fill="#67e8f9">60fps 动画</text>
  <text class="t an" x="110" y="212" font-size="11">本该持续旋转</text>

  <rect x="232" y="178" width="228" height="52" rx="8" fill="#0b1220" stroke="#f87171" stroke-width="2"/>
  <text class="m" x="248" y="200" font-size="11" fill="#fca5a5">for (i=0; i&lt;40_000_000;)</text>
  <text class="m" x="248" y="220" font-size="11" fill="#fca5a5">  sum += i++;   // 主线程占住</text>

  <text class="t" x="64" y="266" font-size="14" font-weight="bold" fill="#f87171">方块冻结 · 点击无响应 · 输入卡顿</text>
  <text class="t an" x="64" y="294">JS 单线程：事件循环同一时刻只跑一个任务</text>
  <text class="t an" x="64" y="318">超过 500ms 的 CPU 密集任务，页面直接"假死"</text>
  <text class="t an" x="64" y="342">注意：fetch/定时器的等待不占线程，无需开 Worker</text>
  <use href="#pixelv2" transform="translate(524,352) scale(0.55)"/>
  <circle cx="556" cy="272" r="12" fill="#f87171"/>
  <text class="t" x="556" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">!</text>

  <!-- ===== 格2 · 机制登场 ===== -->
  <rect x="616" y="120" width="544" height="250" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="616" y="120" width="544" height="250" rx="16" fill="url(#ht)"/>
  <circle cx="642" cy="146" r="14" fill="#a78bfa"/>
  <text class="m" x="642" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">2</text>
  <text class="t pt" x="668" y="152">机制登场 · 线程隔离 + 消息传递</text>

  <rect x="640" y="178" width="190" height="150" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text class="t" x="735" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#67e8f9">主线程</text>
  <text class="t an" x="660" y="230" font-size="11.5">• DOM / 点击 / 动画</text>
  <text class="t an" x="660" y="252" font-size="11.5">• postMessage 发任务</text>
  <text class="t an" x="660" y="274" font-size="11.5">• onmessage 收结果</text>
  <rect x="660" y="290" width="150" height="24" rx="5" fill="#0b1220"/>
  <text class="t" x="735" y="307" text-anchor="middle" font-size="11" fill="#67e8f9">全程保持丝滑</text>

  <rect x="950" y="178" width="190" height="150" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text class="t" x="1045" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#f9a8d4">Worker 线程</text>
  <text class="t an" x="970" y="230" font-size="11.5">• 独立全局 self</text>
  <text class="t an" x="970" y="252" font-size="11.5">• 无 window/document/DOM</text>
  <text class="t an" x="970" y="274" font-size="11.5">• 纯计算：排序/像素/解析</text>
  <rect x="970" y="290" width="150" height="24" rx="5" fill="#0b1220"/>
  <text class="t" x="1045" y="307" text-anchor="middle" font-size="11" fill="#f9a8d4">CPU 拉满也不卡 UI</text>

  <line x1="834" y1="232" x2="946" y2="232" stroke="#fbbf24" stroke-width="2.5"/>
  <polygon points="946,227 954,232 946,237" fill="#fbbf24"/>
  <text class="m" x="890" y="224" text-anchor="middle" font-size="9.5" fill="#fbbf24">数据(克隆)</text>
  <line x1="946" y1="276" x2="834" y2="276" stroke="#a78bfa" stroke-width="2.5"/>
  <polygon points="834,271 826,276 834,281" fill="#a78bfa"/>
  <text class="m" x="890" y="294" text-anchor="middle" font-size="9.5" fill="#c4b5fd">结果(克隆)</text>
  <text class="t an" x="640" y="350">不共享变量，只传消息；函数/DOM 不可传，class 实例克隆后丢原型</text>
  <use href="#taggyv2" transform="translate(1105,356) scale(0.44)"/>

  <!-- ===== 格3 · 落地收束 ===== -->
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="#131c2e" stroke="#334155" stroke-width="3"/>
  <rect x="40" y="390" width="1120" height="230" rx="16" fill="url(#ht)"/>
  <circle cx="66" cy="416" r="14" fill="#fbbf24"/>
  <text class="m" x="66" y="421" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b1220">3</text>
  <text class="t pt" x="92" y="422">落地收束 · Blob 内联 · Transferable · Promise 化</text>

  <rect x="58" y="442" width="360" height="164" rx="10" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text class="m" x="78" y="468" font-size="10.5" fill="#94a3b8">// file:// 双击也能跑：Blob 内联</text>
  <text class="m" x="78" y="490" font-size="10.5" fill="#22d3ee">const url = URL.createObjectURL(</text>
  <text class="m" x="78" y="510" font-size="10.5" fill="#22d3ee">  new Blob([code]));</text>
  <text class="m" x="78" y="530" font-size="10.5" fill="#fbbf24">new Worker(url); // 外部脚本被同源拦</text>
  <text class="t an" x="78" y="558" font-size="11">外部 worker.js 在 file:// 下加载被拒</text>
  <text class="t an" x="78" y="580" font-size="11">工程环境再走 http(s)/localhost 独立文件</text>

  <rect x="434" y="442" width="342" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="454" y="468" font-size="13" font-weight="bold" fill="#f9a8d4">Transferable 零拷贝</text>
  <text class="m" x="454" y="494" font-size="10.5" fill="#cbd5e1">postMessage(buf)          // 完整复制</text>
  <text class="m" x="454" y="516" font-size="10.5" fill="#f472b6">postMessage(buf, [buf])   // 转移所有权</text>
  <text class="m" x="454" y="538" font-size="10.5" fill="#fca5a5">buf.byteLength === 0  // 主线程即刻失效</text>
  <text class="t an" x="454" y="566" font-size="11">大图 ImageData 像素、大 ArrayBuffer 专用</text>
  <text class="t an" x="454" y="588" font-size="11">处理完再转移回来 putImageData</text>

  <rect x="792" y="442" width="348" height="164" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text class="t" x="812" y="468" font-size="13" font-weight="bold" fill="#67e8f9">推荐姿势</text>
  <text class="m" x="812" y="494" font-size="10.5" fill="#cbd5e1">const r = await pw.invoke({</text>
  <text class="m" x="812" y="514" font-size="10.5" fill="#cbd5e1">  type:'sort', data });</text>
  <text class="t an" x="812" y="540" font-size="11">自增 id 关联请求/回包，await 即用</text>
  <text class="t an" x="812" y="562" font-size="11">worker.onerror 必挂，配超时防永久 pending</text>
  <text class="t an" x="812" y="584" font-size="11">用完 terminate() 回收，任务型建议线程池</text>

  <!-- ===== 知识条 ===== -->
  <rect x="40" y="640" width="1120" height="152" rx="16" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <use href="#moov2" transform="translate(150,744) scale(0.62)"/>
  <text class="t kt" x="230" y="676">码叔划重点</text>
  <circle cx="248" cy="703" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="708">Worker 解决 CPU 密集而非网络等待；无 DOM、不共享变量，只靠 postMessage 结构化克隆通信</text>
  <circle cx="248" cy="731" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="736">大 buffer 用 Transferable 转移而非拷贝，转移后原引用 byteLength=0；消息只传纯数据</text>
  <circle cx="248" cy="759" r="4" fill="#b45309"/>
  <text class="t kb" x="266" y="764">file:// 用 Blob 内联 Worker；onerror 必挂、超时保护、terminate 回收一个都不能少</text>
  <rect x="1000" y="700" width="140" height="32" rx="16" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <text class="t" x="1070" y="721" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">EP.17 · Workers</text>

  <text class="t ft" x="40" y="822">霓虹墨 Neon Ink · 第 17 话 — 深入阅读 docs/html/06-web-workers.md · 示例 examples/html/06-web-workers</text>
